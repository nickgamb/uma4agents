# u4a.ai
#
# The site is a Gatsby project under site/, so Netlify builds from that
# directory and publishes what Gatsby emits. Everything it serves is
# same-origin: the animation library is a dependency rather than a CDN
# script, the QR code is a committed file, and no webfont is fetched.

[build]
  base = "site"
  command = "npm ci && npm run build"
  # Relative to `base`, not to the repo root — "site/public" here resolves to
  # site/site/public, which is nowhere.
  publish = "public"

[build.environment]
  NODE_VERSION = "20.15.0"

# The site answers MCP at /mcp, so an agent can read the posts without
# scraping the pages. The function serves a generated index rather than the
# Markdown tree, which is not deployed beside it — `included_files` is what
# gets that index into the bundle, and its path is relative to `base`.
[functions]
  # nft traces the real module graph. esbuild would have to be told about the
  # SDK's dynamic imports, and the JSON is loaded through createRequire.
  node_bundler = "nft"
  included_files = [
    "netlify/functions/blog-data.json",
    "netlify/functions/docs-data.json",
  ]

[[plugins]]
  package = "@netlify/plugin-gatsby"

# /docs/ is not a page — the documentation starts at the Overview tab and the
# nav links straight there. This is so trimming the URL by hand still lands
# somewhere real. Declared here rather than through createRedirect because this
# file is the one that gets read to find out what the host does.
# The identifying URI of each document in the specification set, as UMA 2.0
# Grant section 4 asks a profile to have and an authorization server to
# advertise. They dereference to the document an implementer reading
# uma_profiles_supported needs; the draft name behind each moves with
# revisions, the URI does not.
[[redirects]]
  from = "/spec/core/1.0"
  to = "/spec/draft-gamb-uma4agents-core-00.html"
  status = 302

[[redirects]]
  from = "/spec/terms/1.0"
  to = "/spec/draft-gamb-uma4agents-terms-00.html"
  status = 302

[[redirects]]
  from = "/spec/fedauthz/1.0"
  to = "/spec/draft-gamb-uma4agents-fedauthz-00.html"
  status = 302

[[redirects]]
  from = "/spec/policy/1.0"
  to = "/spec/draft-gamb-uma4agents-policy-00.html"
  status = 302

[[redirects]]
  from = "/spec/lineage/1.0"
  to = "/spec/draft-gamb-uma4agents-lineage-00.html"
  status = 302

[[redirects]]
  from = "/spec/multiparty/1.0"
  to = "/spec/draft-gamb-uma4agents-multiparty-00.html"
  status = 302

[[redirects]]
  from = "/spec/mcp/1.0"
  to = "/spec/draft-gamb-uma4agents-mcp-00.html"
  status = 302

[[redirects]]
  from = "/spec/owner/1.0"
  to = "/spec/draft-gamb-uma4agents-owner-00.html"
  status = 302

[[redirects]]
  from = "/spec/aauth/1.0"
  to = "/spec/draft-gamb-uma4agents-aauth-00.html"
  status = 302

[[redirects]]
  from = "/spec"
  to = "/docs/reference/specification/"
  status = 301

[[redirects]]
  from = "/spec/"
  to = "/docs/reference/specification/"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/docs/overview/"
  status = 301

[[redirects]]
  from = "/docs/"
  to = "/docs/overview/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The Markdown twin of every post, published by gatsby-node's onPostBuild so
# that a language model can read the words without the page around them.
[[headers]]
  for = "/blog/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# The same for the docs twins. Two rules because the docs tree is two levels
# deep (/docs/overview.md and /docs/overview/why.md) and a single `*` is only
# reliably a trailing splat.
[[headers]]
  for = "/docs/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/docs/*/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
