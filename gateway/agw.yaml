# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# agentgateway — the RS-side PEP fronting Alice's vault MCP.
# UMA enforcement is delegated to uma-pep over HTTP ext_authz (Spike D).
binds:
  - port: 3000
    listeners:
      - protocol: HTTP
        routes:
          # RFC 9728 Protected Resource Metadata: open discovery of the
          # owner's AS and the *structural* tool surface (served by the PEP).
          - name: protected-resource-metadata
            matches:
              - path:
                  pathPrefix: /.well-known/oauth-protected-resource
            backends:
              - host: "uma-pep:9002"
          # The AAuth-binding encoding of the same public layer: R3
          # vocabulary + access_mode, sharing the same protected endpoint.
          - name: aauth-resource-metadata
            matches:
              - path:
                  pathPrefix: /.well-known/aauth-resource.json
            backends:
              - host: "uma-pep:9002"
          # The resource's signing keys (RFC 9728 jwks_uri) — verifies
          # signed_metadata.
          - name: resource-jwks
            matches:
              - path:
                  pathPrefix: /jwks
            backends:
              - host: "uma-pep:9002"
          # The protected owner-resources listing ("protected webfinger"):
          # owner-bound resource instances, served only to a caller who
          # proves possession of the owner's AS signing key. The PEP does
          # that verification itself.
          - name: owner-resources
            matches:
              - path:
                  pathPrefix: /owner-resources
            backends:
              - host: "uma-pep:9002"
          # The organization's book, shared with its members.
          #
          # One resource, many administrators: /mcp/shared/alice and
          # /mcp/shared/carol reach the same process, and the only thing the
          # member segment decides is whose authorization server governs the
          # request. That is shared ownership — the resource belongs to
          # Northwind, and each member administers access to it under her own
          # authority and her own terms.
          # One resource, several owners of equal standing. Unlike
          # /mcp/shared above, the segment after the prefix names the
          # *account* rather than a person: no single holder's authority
          # governs this, so there is nobody to name. The challenge from
          # here points at the tally.
          - name: joint-vault-mcp
            matches:
              - path:
                  pathPrefix: /mcp/joint
            policies:
              cors:
                allowOrigins: ["*"]
                allowHeaders: [mcp-protocol-version, content-type,
                               cache-control, mcp-session-id, authorization]
                exposeHeaders: ["Mcp-Session-Id", "WWW-Authenticate"]
              extAuthz:
                host: "uma-pep:9002"
                includeRequestBody:
                  maxRequestBytes: 16384
                includeRequestHeaders:
                  - x-envoy-auth-partial-body
                  - authorization
                  - signature
                  - signature-input
                  - host
                  - content-type
                  - mcp-method
                  - mcp-name
                  - mcp-protocol-version
                  - origin
                  - signature-agent
                  - traceparent
                protocol:
                  http:
                    path: '"/check" + request.path'
            backends:
              - mcp:
                  targets:
                    - name: joint-vault
                      mcp:
                        host: http://joint-vault-mcp:9020/mcp
          - name: northwind-vault-mcp
            matches:
              - path:
                  pathPrefix: /mcp/shared
            policies:
              cors:
                allowOrigins: ["*"]
                allowHeaders: [mcp-protocol-version, content-type,
                               cache-control, mcp-session-id, authorization]
                exposeHeaders: ["Mcp-Session-Id", "WWW-Authenticate"]
              extAuthz:
                host: "uma-pep:9002"
                includeRequestBody:
                  maxRequestBytes: 16384
                includeRequestHeaders:
                  - x-envoy-auth-partial-body
                  - authorization
                  - signature
                  - signature-input
                  - host
                  - content-type
                  - mcp-method
                  - mcp-name
                  - mcp-protocol-version
                  - origin
                  - signature-agent
                  - traceparent
                protocol:
                  http:
                    path: '"/check" + request.path'
            backends:
              - mcp:
                  targets:
                    - name: northwind-vault
                      mcp:
                        host: http://northwind-vault-mcp:9020/mcp
          # One route per owner, most specific first. Her holdings are a
          # different process at a different address, not a filtered view of
          # a shared one.
          - name: carol-vault-mcp
            matches:
              - path:
                  pathPrefix: /mcp/carol
            policies:
              cors:
                allowOrigins: ["*"]
                allowHeaders: [mcp-protocol-version, content-type,
                               cache-control, mcp-session-id, authorization]
                exposeHeaders: ["Mcp-Session-Id", "WWW-Authenticate"]
              extAuthz:
                host: "uma-pep:9002"
                includeRequestBody:
                  maxRequestBytes: 16384
                includeRequestHeaders:
                  - x-envoy-auth-partial-body
                  - authorization
                  - signature
                  - signature-input
                  - host
                  - content-type
                  - mcp-method
                  - mcp-name
                  - mcp-protocol-version
                  - origin
                  - signature-agent
                  - traceparent
                protocol:
                  http:
                    path: '"/check" + request.path'
            backends:
              - mcp:
                  targets:
                    - name: carol-vault
                      mcp:
                        host: http://carol-vault-mcp:9020/mcp
          - name: alice-vault-mcp
            matches:
              - path:
                  pathPrefix: /mcp
            policies:
              cors:
                allowOrigins:
                  - "*"
                allowHeaders:
                  - mcp-protocol-version
                  - content-type
                  - cache-control
                  - mcp-session-id
                  - authorization
                exposeHeaders:
                  - "Mcp-Session-Id"
                  - "WWW-Authenticate"
              extAuthz:
                host: "uma-pep:9002"
                # The PEP needs the MCP JSON-RPC body (tool name + args for
                # scoping and tier-3 operation binding) and the signature
                # headers (proof-of-possession verification).
                includeRequestBody:
                  maxRequestBytes: 16384
                includeRequestHeaders:
                  # Past maxRequestBytes the body is truncated and forwarded,
                  # not refused — so the tool name can vanish from a call that
                  # was merely padded. The PEP denies when this is set rather
                  # than inferring it from a body that will not parse.
                  - x-envoy-auth-partial-body
                  - authorization
                  - signature
                  - signature-input
                  - host
                  - content-type
                  # SEP-2243 mirrors the JSON-RPC method and target into
                  # headers. The PEP reconciles them against the body rather
                  # than trusting either alone.
                  - mcp-method
                  - mcp-name
                  - mcp-protocol-version
                  # MCP 2026-07-28 requires Origin validation at the resource.
                  - origin
                  # Web Bot Auth: covered by the request signature, so the
                  # PEP must see it to reconstruct the signature base.
                  - signature-agent
                  # W3C Trace Context, so protocol events join the caller's trace.
                  - traceparent
                protocol:
                  http:
                    # CEL: forward the original path so the PEP can map
                    # tool calls to registered resources
                    path: '"/check" + request.path'
            backends:
              - mcp:
                  targets:
                    - name: alice-vault
                      mcp:
                        host: http://alice-vault-mcp:9020/mcp
