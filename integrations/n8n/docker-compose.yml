# A U4A enforcement point in front of an MCP server n8n generated.
#
# n8n is not in this file on purpose. It is wherever it already runs, and this
# changes nothing about it — the sidecar is the only thing agents reach, and
# the only thing that has to be exposed.
services:
  u4a-sidecar:
    image: ghcr.io/nickgamb/u4a-pep:latest
    restart: unless-stopped
    environment:
      # Setting an upstream is what turns this from a gateway callout into a
      # reverse proxy. Unset, it serves the ext_authz interface instead.
      UMA_PEP_UPSTREAM: ${UMA_PEP_UPSTREAM}
      UMA_PEP_UPSTREAM_TIMEOUT_S: "60"

      UMA_AS_PUBLIC: ${UMA_AS_PUBLIC}
      UMA_AS_INTERNAL: ${UMA_AS_PUBLIC}
      UMA_OWNER: ${UMA_OWNER}
      UMA_AS_RS_CLIENT_ID: ${UMA_AS_RS_CLIENT_ID}
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET}

      # The public URL agents use. The metadata document claims it, and RFC
      # 9728 has the client refuse a document that names anything else — so a
      # value that does not match what the agent typed fails at discovery,
      # which is the correct and confusing failure.
      UMA_PEP_PUBLIC_BASE: ${UMA_PEP_PUBLIC_BASE}
      UMA_EXPECTED_AUTHORITY: ${UMA_PEP_PUBLIC_BASE}
      UMA_REALM: ${UMA_OWNER}
    volumes:
      - ./tools.json:/config/tools.json:ro
      - sidecar-keys:/keys
    ports:
      - "8443:9000"

volumes:
  sidecar-keys:
