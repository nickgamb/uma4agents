# The same resource, protecting itself.
#
# Core section 8.1 states the enforcement obligations as a conformance profile
# that any resource-side component may satisfy, rather than as a topology. This
# is the other half of that claim, run: the same alice-vault-mcp image, the same
# authorization server, the same ticket, terms and proof-of-possession token,
# with no gateway and no ext_authz service anywhere in the authorization path.
# The enforcement core runs inside the MCP server as an Extension.
#
# Under compose this was `make embedded-check`, which flipped the one vault
# between modes. Here it is a second resource standing beside the first, which
# is the better demonstration: both shapes run at once against one authority,
# and the grant an agent ends up holding is the same either way.
#
# Not an MCPServer, unlike every other vault here, and the reason is a CRD
# limit rather than a preference: kagent.dev/MCPServer takes `env` as a flat
# map[string]string with no valueFrom, and offers configMapRefs but no
# arbitrary volumes. A vault in gateway mode needs neither — it holds no
# credentials at all, which is the point of that shape. This one holds the
# client secret it exchanges for a PAT, so it has to be a Deployment.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alice-vault-embedded
  namespace: meridian
---
apiVersion: v1
kind: Service
metadata:
  name: alice-vault-embedded
  namespace: meridian
  # Through the namespace waypoint, so the path-scoped AuthorizationPolicy
  # below is evaluated at L7. Without it ztunnel judges at L4, where a policy
  # written in terms of paths can only deny — connections reset with nothing
  # in any log naming a reason.
  labels:
    istio.io/use-waypoint: waypoint
spec:
  selector: { app.kubernetes.io/name: alice-vault-embedded }
  ports:
    - { name: http, port: 9020, targetPort: 9020 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alice-vault-embedded
  namespace: meridian
spec:
  # One. The vault generates its signing key on first start when the file is
  # absent (uma_publish.load_or_create), so a second replica would publish a
  # second key and the authority's pull would verify against the wrong one
  # about half the time. The gateway-mode path solves this with a keygen Job
  # into a Secret; here one replica is the honest answer for a resource whose
  # whole purpose is to be the small shape.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alice-vault-embedded }
  template:
    metadata:
      # The label the policy selects on. kmcp sets this for the vaults it
      # creates; this Deployment is ours, so it is set deliberately — a
      # selector that matches nothing protects nothing while looking exactly
      # like one that does.
      labels:
        app.kubernetes.io/name: alice-vault-embedded
        istio.io/use-waypoint: waypoint
    spec:
      serviceAccountName: alice-vault-embedded
      containers:
        - name: vault
          image: localhost:5001/u4a/alice-vault-mcp:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 9020 }
          env:
            - name: ENFORCEMENT_MODE
              value: embedded
            # Its own published identity. The authorization server refuses to
            # pull a registry from anything that is not https on the
            # resource's own origin, so this needs a name at the edge rather
            # than a ClusterIP.
            - name: UMA_EXPECTED_AUTHORITY
              value: embedded.uma.lab
            - name: UMA_PEP_SCHEME
              value: https
            - name: UMA_AS_PUBLIC
              value: https://alice-as.uma.lab
            - name: UMA_AS_INTERNAL
              value: http://uma-as.alice.svc.cluster.local:9000
            # Empty on purpose, and the empty value is what does the work.
            #
            # It introduces itself by signing with the key it publishes at its
            # own origin, the way any resource server nobody provisioned this
            # authority against does. Holding no secret is what selects that:
            # with one it would register under a name it was given, and there
            # is no entry for it in meridian-config to give. Its identifier is
            # then its own origin, so there is no client id to set here
            # either. Alice approves it once, in her portal, like any other
            # stranger.
            - name: UMA_AS_RS_CLIENT_SECRET
              value: ""
            - name: UMA_REALM
              value: alice-vault
            - name: UMA_VAULT_OWNER
              value: alice
            - name: UMA4A_CA_BUNDLE
              value: /certs/rootCA.pem
          volumeMounts:
            - { name: ca, mountPath: /certs, readOnly: true }
            - { name: keys, mountPath: /keys }
          startupProbe:
            tcpSocket: { port: 9020 }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            tcpSocket: { port: 9020 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: ca
          configMap: { name: uma-lab-ca-bundle }
        # Written once by the process itself on first start. An emptyDir is
        # correct at one replica and wrong at more than one, which is why the
        # replica count above is not a tuning knob.
        - name: keys
          emptyDir: {}
---
# Reached by the agent directly, and by Alice's authority to pull what it
# publishes. Not by the enforcement point: there is no enforcement point in
# this path, which is the whole demonstration.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: alice-vault-embedded-callers
  namespace: meridian
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: alice-vault-embedded }
  action: ALLOW
  rules:
    # The agent, arriving through the edge like any other caller from outside.
    - from:
        - source:
            principals: ["cluster.local/ns/uma-edge/sa/edge"]
    # Her authority, completing the pull: the public document and the
    # owner-bound listing behind it.
    - from:
        - source:
            principals: ["cluster.local/ns/alice/sa/uma-as"]
      to:
        - operation:
            paths:
              - /.well-known/*
              - /owner-resources
              - /owner-resources/*
              - /jwks
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alice-vault-embedded
  namespace: meridian
spec:
  parentRefs:
    - { name: edge, namespace: uma-edge }
  hostnames: ["embedded.uma.lab"]
  rules:
    - backendRefs:
        # Straight to the vault. Nothing in front of it.
        - { name: alice-vault-embedded, port: 9020 }
