# Meridian's copy of the client secret it exchanges for a PAT.
#
# Deliberately duplicated rather than shared with alice/uma-as-config: these
# are two different parties, and one Secret referenced from both namespaces
# would model them as one. In a real deployment they would not be able to
# read each other's anyway.
apiVersion: v1
kind: Secret
metadata:
  name: meridian-config
  namespace: meridian
stringData:
  rs-client-secret: gateway-dev-secret
  # Per owner, and deliberately only one entry. What is not in here is the
  # interesting part: Carol's authority is not something this firm was ever
  # given a credential for, so the gateway authenticates to it as its own
  # origin instead — signing with the key it publishes at gateway.uma.lab
  # and waiting for her to say yes. Adding an owner here would mean somebody
  # putting a secret on her server on her behalf.
  rs-secrets: '{"alice": "gateway-dev-secret"}'
  # What this gateway presents to Northwind to read membership and to check
  # the grants that organization signs itself. Provisioned on both sides,
  # unlike a member's authority — the firm's own gateway and the firm's own
  # organization service were stood up by the same people.
  org-rs-token: org-rs-dev-token
  # What this gateway presents to the tally to mint tickets over a jointly
  # held account and to introspect the grants it issues. Provisioned on both
  # sides for the same reason: both are infrastructure. It buys nothing that
  # matters — the verdicts inside a joint grant are checked against the
  # holders' own published keys, not against this.
  tally-rs-secret: tally-rs-dev-secret 
