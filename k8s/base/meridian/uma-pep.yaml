# The enforcement point.
#
# Meridian's, not Alice's. It holds a PAT issued by her authorization server,
# challenges unauthorized calls, introspects grants, verifies
# proof-of-possession and burns single-use tokens — the whole FedAuthz job
# list — and it can never read her policy. That separation is the reason it
# lives in this namespace and not in hers.
#
# Two replicas, because it is stateless apart from its signing key: it holds
# no negotiation, no ticket, no grant. Everything it decides, it decides from
# the request in front of it plus a call to the AS.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uma-pep
  namespace: meridian
---
apiVersion: v1
kind: Service
metadata:
  name: uma-pep
  namespace: meridian
  # Send this Service's traffic through the namespace waypoint.
  #
  # Without it ztunnel evaluates the AuthorizationPolicy at L4, where it
  # cannot read a path, and a policy written in terms of paths denies
  # everything rather than falling back to permit — connections are reset
  # with no entry in any log naming a reason. The policy in
  # k8s/base/policy/authorization.yaml is path-scoped, so it is only
  # meaningful for traffic that reaches the waypoint.
  labels:
    istio.io/use-waypoint: waypoint
spec:
  selector: { app: uma-pep }
  ports:
    - { name: http, port: 9002, targetPort: 9002 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uma-pep
  namespace: meridian
spec:
  replicas: 2
  selector:
    matchLabels: { app: uma-pep }
  template:
    metadata:
      # Both halves are needed: the label on the Service routes traffic
      # addressed to the VIP through the waypoint, and this one covers
      # callers that resolve endpoints and dial a pod directly — which a
      # gateway does. Without it that traffic bypasses the waypoint and is
      # judged at L4, where a path-scoped policy can only deny.
      labels: { app: uma-pep, istio.io/use-waypoint: waypoint }
    spec:
      serviceAccountName: uma-pep
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: uma-pep }
      containers:
        - name: uma-pep
          image: localhost:5001/u4a/uma-pep:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 9002 }
          env:
            # The AS's public identity, used for anything that must match what
            # the agent was told, and its in-cluster address for the calls
            # that are ours to make.
            - name: UMA_AS_PUBLIC
              value: https://alice-as.uma.lab
            - name: UMA_AS_INTERNAL
              value: http://uma-as.alice.svc.cluster.local:9000
            - name: UMA_AS_RS_CLIENT_ID
              value: meridian-gateway
            - name: UMA_AS_RS_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: meridian-config, key: rs-client-secret }
            # Only Alice's authority was provisioned with this gateway.
            # There is no secret here for Carol's and there could not be:
            # nobody was in a position to configure both ends. The enforcer
            # for any owner not named here registers by signing with the key
            # this origin publishes at /jwks, and waits for her.
            - name: UMA_PEP_RS_SECRETS
              valueFrom:
                secretKeyRef: { name: meridian-config, key: rs-secrets }
            - name: UMA_REALM
              value: alice-vault
            # Meridian holds more than one person's account. Every owner
            # named here gets /mcp/<owner>, with her own tool namespace, her
            # own PAT and her own RFC 9728 metadata naming the authority that
            # governs her.
            - name: UMA_EXTRA_OWNERS
              value: carol
            # Which authority governs which owner. Both named, because
            # neither is the default — the resource server holds a PAT from
            # each and enforces for both, and it is the owner who decides
            # which server that is.
            - name: UMA_OWNER_AUTHORITIES
              value: >-
                {"alice": {"public": "https://alice-as.uma.lab",
                           "internal": "http://uma-as.alice.svc.cluster.local:9000"},
                 "carol": {"public": "https://carol-as.uma.lab",
                           "internal": "http://uma-as.carol.svc.cluster.local:9000"}}
            # The organization above these owners, configured on the firm's
            # side rather than discovered from an owner's authority — which
            # is the whole value of it. An owner may name any authorization
            # server she likes; the resources at /mcp/shared still belong to
            # Northwind, so the check that its ceiling was applied has to
            # come from somewhere she does not control. This is also how a
            # break-glass grant, signed by Northwind and never seen by her
            # authority, is recognised here.
            - name: UMA_PEP_ORG_ISSUER
              value: https://northwind-org.uma.lab
            - name: UMA_PEP_ORG_INTERNAL
              value: http://org-authority.northwind.svc.cluster.local:9040
            - name: UMA_PEP_ORG_TOKEN
              valueFrom:
                secretKeyRef: { name: meridian-config, key: org-rs-token }
            # How long this gateway may act on a cached answer about who is
            # a member. The window is somebody's access to the firm's book
            # after the firm withdrew it, so it is short and it is
            # configuration.
            - name: UMA_PEP_MEMBERSHIP_TTL_S
              value: "10"
            # Jointly held accounts. The tally is named here rather than read
            # off a grant: a resource server that accepted whichever issuer
            # embedded a plausible mandate would be taking the electorate
            # from the party that assembled it.
            - name: UMA_PEP_JOINT_TALLY
              value: https://joint-tally.uma.lab
            - name: UMA_PEP_JOINT_TALLY_INTERNAL
              value: http://joint-tally.tally.svc.cluster.local:9060
            - name: UMA_PEP_JOINT_SECRET
              valueFrom:
                secretKeyRef: { name: meridian-config, key: tally-rs-secret }
            - name: UMA_PEP_JOINT_ACCOUNTS
              value: meridian-joint,meridian-either
            # The authority the RFC 9421 signature base is rebuilt from.
            # Deliberately configuration and never the request: the Host
            # header does not survive the ext_authz hop (it arrives as this
            # service's own address), and an authority taken from a header is
            # an authority an attacker can set. See FINDINGS rec 1.
            - name: UMA_EXPECTED_AUTHORITY
              value: gateway.uma.lab
            - name: UMA4A_CA_BUNDLE
              value: /certs/rootCA.pem
          volumeMounts:
            - { name: ca, mountPath: /certs, readOnly: true }
            - { name: signing-key, mountPath: /keys, readOnly: true }
          startupProbe:
            httpGet: { path: /health, port: 9002 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 9002 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 9002 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: ca
          configMap: { name: uma-lab-ca-bundle }
        - name: signing-key
          secret: { secretName: uma-pep-signing-key }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: uma-pep
  namespace: meridian
spec:
  # One of two. Note there is deliberately no budget on any single-replica
  # workload in this stack: minAvailable:1 against replicas:1 blocks a node
  # drain forever, which is the most common way a budget makes things worse.
  minAvailable: 1
  selector:
    matchLabels: { app: uma-pep }
