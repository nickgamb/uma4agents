# The identity provider. Not Alice's, not Carol's.
#
# It sits in its own namespace because that is what it is: a third party both
# owners resolve and neither runs, the way most people's login already works.
# Putting it in one owner's namespace would have said the opposite — that
# whoever holds that namespace can mint the other, which is the one thing an
# authority that is supposed to be hers cannot allow.
#
# Each owner has her own realm and her own users inside it. The realms are
# the boundary: a token from `alice` does not authenticate Carol to anything,
# and `carol-as` will not accept one — see the identity-provider assertions
# in clients/demo-driver/multi_owner_check.py.
#
# Keycloak is here for exactly what it is boring at — a realm, a user, and an
# OIDC login for a portal. The grant loop deliberately does not use its stock
# UMA 2.0 support, which cannot express a dictated intent contract; each
# authorization server signs its own tokens and only asks Keycloak "is this
# her?".
#
# start-dev with an in-memory database, same as compose: the realm is
# imported at boot and there is no identity state worth persisting between
# runs. Everything that must survive a restart lives in Postgres or a Secret.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: idp
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: idp
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: idp
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      serviceAccountName: keycloak
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.5
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9000 }
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: uma4agents-admin
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: https://keycloak.uma.lab
            - name: KC_HTTP_ENABLED
              value: "true"
            # The edge terminates TLS, so Keycloak has to be told to believe
            # the forwarded scheme or every redirect it issues comes back as
            # http and the login loop never closes.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms256m -Xmx512m"
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          # Realm import on a laptop is slow, and a liveness probe that fires
          # during it restarts the pod forever. The startup probe is what
          # buys the time; liveness only takes over once it has passed.
          startupProbe:
            httpGet: { path: /health/started, port: 9000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: realm
          configMap: { name: realms }
