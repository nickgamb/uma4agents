# Carol's portal. The same file as Alice's with her authority, her realm and
# her vault in it, which is the whole difference between one owner and
# another. She is not a variant of Alice; she is another one.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: carol
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: carol
spec:
  selector: { app: portal }
  ports:
    - { name: http, port: 9010, targetPort: 9010 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: carol
spec:
  replicas: 1
  # Recreate rather than RollingUpdate: with in-process sessions, two
  # portals briefly coexisting is the same bug as two permanently.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: portal }
  template:
    metadata:
      labels: { app: portal }
    spec:
      serviceAccountName: portal
      containers:
        - name: portal
          image: localhost:5001/u4a/portal:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 9010 }
          env:
            - name: UMA_PORTAL_OWNER
              value: carol
            - name: UMA_AS_INTERNAL
              value: http://uma-as.carol.svc.cluster.local:9000
            - name: PORTAL_AUTH
              value: oidc
            - name: OIDC_ISSUER
              value: https://keycloak.uma.lab/realms/carol
            - name: OIDC_CLIENT_ID
              value: meridian-portal
            - name: PORTAL_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: portal-config, key: session-secret }
            - name: VAULT_MCP_URL
              # Alice reads and trades her own vault directly — she owns it.
              # Other people's agents reach the same vault only through the
              # gateway, after negotiating a grant. That asymmetry is the
              # whole design, and here it is two different URLs.
              value: http://carol-vault.meridian.svc.cluster.local:9020/mcp
            - name: PORTAL_PUBLIC_URL
              value: https://carol-portal.uma.lab
            - name: SSL_CERT_FILE
              value: /certs/rootCA.pem
          volumeMounts:
            - { name: ca, mountPath: /certs, readOnly: true }
          startupProbe:
            httpGet: { path: /health, port: 9010 }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /health, port: 9010 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 9010 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: ca
          configMap: { name: uma-lab-ca-bundle }
