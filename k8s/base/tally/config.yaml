# The mandates this tally counts for. The secret the enforcement point
# presents (`tally-rs`) is generated per cluster by `make k8s-up`.
#
# Two accounts, because the interesting comparison is between them: the same
# machinery, the same holders, and a different rule. `meridian-joint` needs
# both of them; `meridian-either` is the "either or survivor" arrangement
# every joint bank account actually has.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tally-mandates
  namespace: tally
data:
  mandates.json: |
    {
      "meridian-joint": {
        "resources": ["meridian-joint/get_positions",
                      "meridian-joint/get_transactions",
                      "meridian-joint/execute_trade"],
        "holders": [
          {"owner": "alice", "issuer": "https://alice-as.uma.lab"},
          {"owner": "carol", "issuer": "https://carol-as.uma.lab"}
        ],
        "rule": {"kind": "all"}
      },
      "meridian-either": {
        "resources": ["meridian-either/get_positions",
                      "meridian-either/get_transactions",
                      "meridian-either/execute_trade"],
        "holders": [
          {"owner": "alice", "issuer": "https://alice-as.uma.lab"},
          {"owner": "carol", "issuer": "https://carol-as.uma.lab"}
        ],
        "rule": {"kind": "any"}
      }
    }
