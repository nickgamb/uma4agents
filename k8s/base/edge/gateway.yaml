# The north-south edge: kgateway, terminating TLS for every *.uma.lab name.
#
# This replaces the Envoy container the compose stack runs, and the routes
# below are a one-for-one translation of edge/envoy.yaml's virtual hosts. The
# interesting difference is that each party publishes its route beside its own
# workloads, and the listener for a hostname admits only the namespace that
# owns it, so no party can answer for another's name.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-server
  namespace: uma-edge
spec:
  secretName: edge-server-tls
  issuerRef:
    name: uma-lab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "uma.lab"
    - "*.uma.lab"
    - "localhost"
  duration: 8760h
  renewBefore: 720h
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: uma-edge
spec:
  gatewayClassName: kgateway
  infrastructure:
    # Without this reference the GatewayParameters below are inert and
    # kgateway provisions its default LoadBalancer on a random node port,
    # which the host mapping does not reach.
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: edge-params
  listeners:
    # One listener per hostname, each admitting routes only from the namespace
    # that owns that name. A single wildcard listener open to every party
    # namespace let one party attach a more specific route to another's
    # hostname, because nothing tied a hostname to a namespace. A hostname not
    # listed here has no listener, so a route for it attaches nowhere.
    - name: agent
      protocol: HTTPS
      port: 443
      hostname: agent.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: sterling-vance
    - name: alice-agent
      protocol: HTTPS
      port: 443
      hostname: alice-agent.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: alice
    - name: alice-as
      protocol: HTTPS
      port: 443
      hostname: alice-as.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: alice
    - name: carol-as
      protocol: HTTPS
      port: 443
      hostname: carol-as.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: carol
    - name: carol-portal
      protocol: HTTPS
      port: 443
      hostname: carol-portal.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: carol
    - name: gateway
      protocol: HTTPS
      port: 443
      hostname: gateway.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: meridian
    - name: joint-tally
      protocol: HTTPS
      port: 443
      hostname: joint-tally.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: tally
    - name: keycloak
      protocol: HTTPS
      port: 443
      hostname: keycloak.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: idp
    - name: northwind-org
      protocol: HTTPS
      port: 443
      hostname: northwind-org.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: northwind
    - name: org-console
      protocol: HTTPS
      port: 443
      hostname: org-console.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: northwind
    - name: portal
      protocol: HTTPS
      port: 443
      hostname: portal.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: alice
    - name: ps
      protocol: HTTPS
      port: 443
      hostname: ps.uma.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: aauth
---
# kgateway provisions a Service for the Gateway; pin it to the NodePort the
# kind cluster maps to the host's :443, so https://portal.uma.lab works in a
# browser exactly as it does under compose.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: edge-params
  namespace: uma-edge
spec:
  kube:
    service:
      type: NodePort
      # 30443 is what k8s/kind/cluster.yaml maps to the host's :443. Pinned
      # rather than allocated, because the host mapping is fixed at cluster
      # creation and a randomly-assigned port would land nowhere.
      ports:
        - port: 443
          nodePort: 30443
      extraLabels:
        u4a.ai/edge: "true"
