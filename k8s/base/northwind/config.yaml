# Northwind Capital's own secrets, in Northwind's own namespace.
#
# Deliberately not shared with meridian or with any member. Three parties, and
# the organization is the third one — the arrangement this whole namespace
# exists to demonstrate is that a firm can own resources, set policy over
# them, and share them with people whose authorization servers it does not
# run and cannot read.
#
# What is *not* here is worth as much as what is. There is no credential for
# Alice's authority and none for Carol's. The organization reaches a member's
# authority by signing with the key it publishes at its own origin, and that
# authority verifies it by fetching those keys — the same shape the gateway
# uses to introduce itself to an authority nobody configured it against.
apiVersion: v1
kind: Secret
metadata:
  name: org-config
  namespace: northwind
stringData:
  # What an enforcement point presents to read membership and to check the
  # grants this organization signs itself. The firm's own gateway, so a
  # provisioned secret is the honest shape — unlike a member's authority,
  # which nobody was in a position to configure both ends of.
  rs-token: org-rs-dev-token
  # For the acceptance job, which has no browser to log in with. An
  # administrator uses the realm.
  admin-token: org-admin-dev-token
  join-code: NW-7K2F-QX
  session-secret: dev-session-secret
