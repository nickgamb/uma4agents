# The trust boundary.
#
# This directory is the content. Everything else in k8s/ is plumbing that
# gets the same four beats running that already ran under compose; this is
# the part that could not be expressed there at all.
#
# ztunnel gives every workload a SPIFFE identity derived from its
# ServiceAccount — spiffe://cluster.local/ns/<namespace>/sa/<name> — and mTLS
# between all of them. These policies are written against those identities,
# so "who may call this" is answered by a certificate rather than by network
# position. A pod that gets a new IP, or a workload that lies about its
# name, changes nothing.
#
# ────────────────────────────────────────────────────────────────────────
# THREE RULES THAT BREAK THE GRANT IF YOU GET THEM WRONG, AND FAIL SILENTLY
#
# 1. alice/uma-as MUST be allowed out to the edge on :443. The authorization
#    server dereferences its own public hostname to pull the registry. Deny
#    it and the pull retries for two minutes and then gives up with one log
#    line; every later grant fails with invalid_resource_id.
#
# 2. meridian/uma-pep MUST be allowed to reach alice/uma-as on /jwks. The
#    pull is a *cycle*: the AS signs its query, and the resource server
#    authenticates it by fetching the AS's published keys mid-request. Deny
#    that and the AS's own pull hangs on a call it is itself waiting for.
#
# 3. The waypoint intercepts traffic *inbound* to a namespace's services, not
#    a workload's egress. Rule 1 is therefore an egress question and is not
#    solved by anything written here.
# ────────────────────────────────────────────────────────────────────────
#
# ────────────────────────────────────────────────────────────────────────
# WHERE A POLICY IS ENFORCED DEPENDS ON WHAT IT TARGETS
#
# A policy with `selector` is enforced by ztunnel, at L4. A policy that names
# an HTTP path must instead be bound with `targetRefs` to the *Service*,
# which is what hands it to that Service's waypoint.
#
# Get this wrong and the failure is total rather than partial: ztunnel cannot
# evaluate a path, so it does not fall back to allowing the connection — it
# denies it. Every call to the enforcement point returns 403 and the gateway
# reports only "external authorization failed", which is the correct answer
# to the wrong question.
# ────────────────────────────────────────────────────────────────────────
#
# ────────────────────────────────────────────────────────────────────────
# A PRINCIPAL RULE SILENTLY EXCLUDES ANYTHING OUTSIDE THE MESH
#
# `principals` matches a SPIFFE identity, and only a workload in the mesh
# has one. Name the ServiceAccount of a controller that is not enrolled and
# the rule matches nothing — not "matches loosely", nothing — so the caller
# is denied by the namespace default and the rule that was supposed to admit
# it looks correct in every review.
#
# That is how the database operator was locked out of the database it
# manages: the rule named it correctly and cnpg-system was not in the mesh,
# so its traffic arrived with no identity at all. The cluster kept serving
# and only stopped being *manageable* — no failover, no promotion — which is
# invisible until the day it matters. Any namespace whose workloads must be
# named in a policy has to be enrolled; k8s/base/namespaces enrols
# cnpg-system for exactly this reason.
# ────────────────────────────────────────────────────────────────────────
---
# Mesh-wide mTLS. Nothing in this cluster talks to anything else in the clear.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# ═══ alice ═══════════════════════════════════════════════════════════════
#
# Default deny. Without a matching ALLOW below, nothing reaches anything in
# this namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: alice
spec:
  {}
---
# The authorization server's public surface: the grant loop, discovery, and
# the Protection API. Reachable by the edge (which is how an agent arrives)
# and by Meridian's enforcement point (which introspects and consumes).
#
# Note what is *not* here: /owner. The owner API is deliberately excluded
# from this rule and granted separately below, because a rule written at L4
# — "may this workload reach port 9000" — cannot make that distinction, and
# letting the resource server reach the port would let it read and rewrite
# Alice's policy.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uma-as-grant-surface
  namespace: alice
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: uma-as
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/uma-edge/sa/edge
              - cluster.local/ns/meridian/sa/uma-pep
      to:
        - operation:
            paths:
              - /token
              # How a resource server nobody provisioned this authority
              # against introduces itself. Public in the same sense /token
              # is: reaching it proves nothing and grants nothing — the
              # signature is checked against the origin's own published key,
              # and what it earns is a place in her registry marked pending.
              - /rs/register
              - /perm
              - /introspect
              - /consume
              - /jwks
              - /audit/access
              - /terms
              - /terms/*
              - /.well-known/*
              - /health
              - /health/*
---
# Her own surface: what is pending, her tiers, her ledger, her registries.
#
# Two callers, and the second is not a relaxation of the first. Her portal
# runs in her namespace and reaches the Service directly. She also reaches it
# from outside the cluster — a browser, a phone, whatever she runs as her own
# AI — and all of that arrives at the edge, because that is where anything
# not already inside arrives from. Naming only the portal here would not have
# made the owner API portal-only; it would have made an authority unusable by
# the person it belongs to unless someone deploys a portal in front of it,
# which is precisely the assumption a personal authorization server breaks.
#
# What actually authenticates her is not the hop. `require_owner` takes an
# OIDC token from her realm or an RFC 9421 signature from her device key, and
# returns the owner that credential proved — never one the request named. An
# attacker at the edge with no credential of hers reaches a 401, and one
# holding Carol's reaches Carol's data on Carol's server and nothing here.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uma-as-owner-api
  namespace: alice
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: uma-as
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/alice/sa/portal
              - cluster.local/ns/uma-edge/sa/edge
      to:
        - operation:
            paths: ["/owner", "/owner/*"]
---
# Alice's own operator directory. Public by design — a key directory exists to
# be fetched by parties who have never met the agent, which is the RqP != RO
# cold-start problem — so the allow is the edge, exactly as it is for her
# portal. It reaches the default-deny namespace only through the Gateway.
#
# This needed writing because `alice` denies by default. A workload added here
# without a rule is not broken in any way that says so: the route programmes,
# the Service gets endpoints, and calls fail at ztunnel.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: alice-operator-callers
  namespace: alice
spec:
  selector:
    matchLabels: { app: alice-operator }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/uma-edge/sa/edge"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: portal-callers
  namespace: alice
spec:
  selector:
    matchLabels: { app: portal }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/uma-edge/sa/edge"]
---
# The database. One caller, ever.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uma-as-db-callers
  namespace: alice
spec:
  selector:
    matchLabels: { cnpg.io/cluster: uma-as-db }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/alice/sa/uma-as
              # CloudNativePG's operator manages failover and backups. Naming
              # it here only works because cnpg-system is *in* the mesh — see
              # the note below, which cost an afternoon.
              - cluster.local/ns/cnpg-system/sa/cnpg-cloudnative-pg
    # The instances themselves: streaming replication on 5432, and the
    # instance manager that runs the election on 8000. Restricting this to
    # 5432 looks tighter and quietly breaks failover — the cluster stays
    # "healthy" until the moment it has to promote.
    - from:
        - source:
            principals: ["cluster.local/ns/alice/sa/uma-as-db"]
---
# ═══ carol ═══════════════════════════════════════════════════════════════
#
# The same four rules as alice, over a different authority. They are written
# out rather than templated because that is what the manifests are for: an
# owner is a namespace with an authorization server in it, and adding one is
# copying this block and changing a word. Nothing here refers to alice and
# nothing in alice refers to here.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: carol
spec:
  {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uma-as-grant-surface
  namespace: carol
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: uma-as
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/uma-edge/sa/edge
              - cluster.local/ns/meridian/sa/uma-pep
      to:
        - operation:
            paths:
              - /token
              - /rs/register
              - /perm
              - /introspect
              - /consume
              - /jwks
              - /audit/access
              - /terms
              - /terms/*
              - /.well-known/*
              - /health
              - /health/*
---
# Carol's own surface. No portal is deployed in front of it, so the edge is
# the only way she arrives — see the note on Alice's rule for why that is the
# credential's job rather than the network's.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uma-as-owner-api
  namespace: carol
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: uma-as
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/carol/sa/portal
              - cluster.local/ns/uma-edge/sa/edge
      to:
        - operation:
            paths: ["/owner", "/owner/*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: portal-callers
  namespace: carol
spec:
  selector:
    matchLabels: { app: portal }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/uma-edge/sa/edge"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-waypoint
  namespace: carol
spec:
  selector:
    matchLabels: { istio.io/use-waypoint: waypoint }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/carol/sa/waypoint"]
---
# ═══ idp ═════════════════════════════════════════════════════════════════
#
# The identity provider answers both owners and neither runs it. The rule
# names who may reach it rather than who may be minted by it: that boundary
# is the realm, and it is enforced inside Keycloak — a token from `alice` does
# not authenticate Carol, and each authority checks the issuer of what it is
# handed against its own realm.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: idp
spec:
  {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: keycloak-callers
  namespace: idp
spec:
  selector:
    matchLabels: { app: keycloak }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/uma-edge/sa/edge          # an owner's browser
              - cluster.local/ns/alice/sa/portal     # the OIDC exchange
              - cluster.local/ns/alice/sa/uma-as           # her realm's JWKS
              - cluster.local/ns/carol/sa/uma-as           # and hers
---
# ═══ meridian ════════════════════════════════════════════════════════════
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: meridian
spec:
  {}
---
# The enforcement point, split by path the same way the AS is.
#
# /check* is the ext_authz callback and belongs to the gateway alone.
# /owner-resources is the "protected webfinger": the owner-bound listing of
# what this resource server holds for Alice, served only to her authorization
# server — which is also the second half of the pull cycle named at the top
# of this file.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uma-pep-surfaces
  namespace: meridian
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: uma-pep
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/meridian/sa/meridian"]
      to:
        - operation:
            paths: ["/check", "/check/*"]
    - from:
        - source:
            principals:
              - cluster.local/ns/alice/sa/uma-as
              - cluster.local/ns/meridian/sa/meridian
      to:
        - operation:
            paths:
              - /owner-resources
              - /jwks
              - /.well-known/*
              - /health
---
# The vault. Only the gateway in front of it, and Alice's own portal —
# because she owns it and reads it directly, which is the asymmetry the
# whole lab is about. Notably *not* the enforcement point: the PEP decides,
# it never fetches.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: alice-vault-callers
  namespace: meridian
spec:
  selector:
    # kmcp labels what it creates with the recommended keys rather than a
    # bare `app`, so a selector guessed from the other workloads here
    # matches nothing — and a policy that selects nothing protects nothing
    # while looking exactly like one that does.
    matchLabels: { app.kubernetes.io/name: alice-vault }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/meridian/sa/meridian
              - cluster.local/ns/alice/sa/portal
---
# The same, for Carol's instance. Written out rather than widened to select
# both, because a selector matching every vault in the namespace would let
# whoever may reach one reach all of them — and the reason there are two
# instances instead of one multi-tenant process is precisely that.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: carol-vault-callers
  namespace: meridian
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: carol-vault }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/meridian/sa/meridian
              - cluster.local/ns/carol/sa/portal
---
# The agent-facing gateway. Reachable from the edge — which is how Bob's
# agent arrives, and the only way it can.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: meridian-gateway-callers
  namespace: meridian
spec:
  selector:
    matchLabels: { gateway.networking.k8s.io/gateway-name: meridian }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/uma-edge/sa/edge"]
---
# The waypoints themselves must be allowed through to the workloads they
# front, and this is the piece that is easy to miss.
#
# Once a workload is behind a waypoint the traffic arrives in two hops:
# caller → waypoint (where the path rules above are evaluated) → workload
# (where ztunnel evaluates workload policy). On that second hop the source
# identity is the *waypoint's*, not the original caller's. With a
# default-deny in the namespace and no rule naming the waypoint, everything
# is refused after the policy that was supposed to permit it has already
# said yes — which presents as a 503 with nothing denied in any log, because
# from the waypoint's point of view nothing was.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-waypoint
  namespace: alice
spec:
  selector:
    matchLabels: { istio.io/use-waypoint: waypoint }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/alice/sa/waypoint"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-waypoint
  namespace: meridian
spec:
  selector:
    matchLabels: { istio.io/use-waypoint: waypoint }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/meridian/sa/waypoint"]
---
# ═══ aauth ═══════════════════════════════════════════════════════════════
#
# The identity authority answers anyone who asks — that is what a published
# issuer is for. It is in the mesh so that its callers are attested and
# logged, not so that they are restricted.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: person-server-callers
  namespace: aauth
spec:
  selector:
    matchLabels: { app: person-server }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/uma-edge/sa/edge
              - cluster.local/ns/alice/sa/uma-as
              - cluster.local/ns/sterling-vance/sa/agent
---
# The U4A adapter, reachable by the agent framework that uses it.
#
# The adapter runs in Bob's namespace and holds Bob's key. What may call it is
# therefore a question about *his* side of the boundary, not Alice's — and the
# answer is deliberately narrow: the kagent controller, which reads its tool
# list, and the agents that controller runs.
#
# Nothing here loosens anything on Alice's side. Whatever reaches the adapter
# still has to negotiate the four beats with her authority like any other
# agent, and the adapter is what does that negotiating. This rule decides who
# may ask Bob's adapter to act, not what Alice will permit.
#
# It is also why `make k8s-adapter-check` passes without it: that Job runs
# inside sterling-vance, and this is about crossing into it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agent-shim-callers
  namespace: sterling-vance
spec:
  selector:
    matchLabels: { app: agent-shim }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/sterling-vance/sa/agent
              - cluster.local/ns/kagent/sa/kagent
              - cluster.local/ns/kagent/sa/kagent-controller
              - cluster.local/ns/sterling-vance/sa/advisory-agent
