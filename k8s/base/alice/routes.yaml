# Alice's front doors.
#
# The routes live here, in her namespace, rather than all being written by
# whoever operates the edge. That is not tidiness: attaching a route to a
# shared Gateway is how a party publishes itself, and the Gateway's
# allowedRoutes selector is how the edge decides whose publishing it accepts.
# Each party controls its own hostnames and nobody controls anyone else's.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alice-as
  namespace: alice
spec:
  parentRefs:
    - { name: edge, namespace: uma-edge }
  hostnames: ["alice-as.uma.lab"]
  rules:
    - backendRefs:
        - { name: uma-as, port: 9000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: alice
spec:
  parentRefs:
    - { name: edge, namespace: uma-edge }
  hostnames: ["portal.uma.lab"]
  rules:
    - backendRefs:
        - { name: portal, port: 9010 }
