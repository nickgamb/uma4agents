# Signing keys, generated once and shared.
#
# Both uma-as and uma-pep call `load_or_create_key()` at startup: if the PEM
# is there they load it, otherwise they generate one. Under compose that is
# backed by a per-container volume and there is exactly one container, so it
# works. At replicas each pod generates a *different* key, and neither
# failure is a clean error:
#
#   uma-as   — three replicas publish three different JWKS behind one
#              Service, so a token signed by one verifies against another
#              roughly a third of the time.
#   uma-pep  — one replica signs the resource's signed_metadata, the AS
#              fetches /jwks and reaches a different replica, and the
#              registry pull fails with "signed_metadata did not verify"
#              about half the time.
#
# So the key is generated once into a Secret and mounted read-only. No
# application change: load_or_create_key finds the file and loads it.
#
# The job runs the service's own image and talks to the Kubernetes API with
# its mounted ServiceAccount token. That is deliberate: the obvious
# alternative — a kubectl image plus `openssl genpkey` — needs a container
# that has both, and the usual kubectl images ship neither openssl nor a
# package manager anyone should be invoking at job runtime. The service image
# already carries the exact library that will later load this key, so the key
# is generated by the same code that has to read it.
#
# Idempotent: it creates the Secret only if absent, so re-applying the stack
# never rotates a key underneath running pods.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keygen
  namespace: alice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keygen
  namespace: alice
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # get to check, create to make. Deliberately no update or delete: this
    # job must never be able to replace a key that already exists.
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keygen
  namespace: alice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keygen
subjects:
  - kind: ServiceAccount
    name: keygen
    namespace: alice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keygen-script
  namespace: alice
data:
  keygen.py: |
    """Create an Ed25519 signing key as a Secret, once."""
    import base64, json, os, ssl, sys, urllib.request

    NAME = sys.argv[1]          # secret name
    FILENAME = sys.argv[2]      # key within the secret, and the mounted filename
    # A third argument asks for the public half alongside the private one.
    # The owner's device key needs both and they go to different places: the
    # private half is mounted into her personal AI, the public half into her
    # authorization server, which is the whole point of it being a key she
    # holds rather than a credential she is issued.
    PUBNAME = sys.argv[3] if len(sys.argv) > 3 else None
    NS = os.environ.get("POD_NAMESPACE", "alice")

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    with open(f"{SA}/token") as f:
        token = f.read().strip()
    api = "https://kubernetes.default.svc"
    ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")

    def call(method, path, body=None):
        req = urllib.request.Request(
            api + path, method=method,
            data=json.dumps(body).encode() if body is not None else None,
            headers={"Authorization": f"Bearer {token}",
                     "Content-Type": "application/json"})
        return urllib.request.urlopen(req, context=ctx)

    try:
        call("GET", f"/api/v1/namespaces/{NS}/secrets/{NAME}")
        print(f"{NAME} already exists; leaving it alone")
        raise SystemExit(0)
    except urllib.error.HTTPError as exc:
        if exc.code != 404:
            raise

    from cryptography.hazmat.primitives import serialization
    from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

    key = Ed25519PrivateKey.generate()
    pem = key.private_bytes(
        serialization.Encoding.PEM,
        serialization.PrivateFormat.PKCS8,
        serialization.NoEncryption())

    data = {FILENAME: base64.b64encode(pem).decode()}
    if PUBNAME:
        pub = key.public_key().public_bytes(
            serialization.Encoding.PEM,
            serialization.PublicFormat.SubjectPublicKeyInfo)
        data[PUBNAME] = base64.b64encode(pub).decode()

    call("POST", f"/api/v1/namespaces/{NS}/secrets", {
        "apiVersion": "v1", "kind": "Secret", "metadata": {"name": NAME},
        "data": data,
    })
    print(f"{NAME} created")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: uma-as-keygen
  namespace: alice
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: keygen }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keygen
      containers:
        - name: keygen
          image: localhost:5001/u4a/uma-as:dev
          imagePullPolicy: Always
          command: ["python3", "/script/keygen.py", "uma-as-signing-key", "uma-as-ed25519.pem"]
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: script
          configMap: { name: keygen-script }
---
# Alice's device key. The private half is mounted into her personal AI; the
# public half into her authorization server, which verifies her signature
# against it. She is the only party that ever holds the private one.
apiVersion: batch/v1
kind: Job
metadata:
  name: owner-keygen
  namespace: alice
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: keygen }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keygen
      containers:
        - name: keygen
          image: localhost:5001/u4a/uma-as:dev
          imagePullPolicy: Always
          command: ["python3", "/script/keygen.py", "owner-device-key",
                    "owner-ed25519.pem", "owner-ed25519.pub"]
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: script
          configMap: { name: keygen-script }
