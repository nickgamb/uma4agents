# Bob's firm's public presence.
#
# Two things the requesting side needs somewhere on the web: a Client ID
# Metadata Document, so Alice's approval dialog can show an operator instead
# of a bare key thumbprint, and a Web Bot Auth key directory, so a resource
# that has never met this agent can learn its key belongs to a published
# operator. Both are display and discovery only — nothing here can widen
# access, because the connection is keyed by the agent's key or its verified
# issuer.
#
# Two replicas, which is only correct because this deployment provisions the
# key directory instead of letting agents fill it in at runtime.
#
# The distinction is not cosmetic and it was found by a failing check. A
# directory filled in by POST /register lives in one process's memory: with
# two replicas the registration lands on one, the authorization server's
# fetch is load-balanced to the other, the key is missing, and an agent that
# did everything right scores accountability 1 instead of 2 — about half the
# time, silently. Both replicas end up publishing the same `kid` with
# different key material.
#
# So the operator is handed a published JWKS (AGENT_OPERATOR_KEYS_FILE) and
# serves only that: read-only, identical on every replica, and unable to
# drift. The server refuses POST /register outright once that file is set,
# which is what makes running several of these correct rather than lucky.
# The way to make a service horizontally scalable is to stop it holding
# state, not to replicate the state.
#
# The agent holds the private half of the same key, from the same Secret, so
# what it signs with is genuinely what its operator published — which is the
# real relationship rather than an agent asserting itself into a directory.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-operator
  namespace: sterling-vance
---
apiVersion: v1
kind: Service
metadata:
  name: agent-operator
  namespace: sterling-vance
spec:
  selector: { app: agent-operator }
  ports:
    - { name: http, port: 9030, targetPort: 9030 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator
  namespace: sterling-vance
spec:
  replicas: 2
  selector:
    matchLabels: { app: agent-operator }
  template:
    metadata:
      labels: { app: agent-operator }
    spec:
      serviceAccountName: agent-operator
      containers:
        - name: agent-operator
          image: localhost:5001/u4a/agent-operator:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 9030 }
          env:
            - name: AGENT_OPERATOR_ORIGIN
              value: https://agent.uma.lab
            - name: AGENT_OPERATOR_KEYS_FILE
              value: /published/agent-jwks.json
          volumeMounts:
            - { name: published, mountPath: /published, readOnly: true }
          startupProbe:
            httpGet: { path: /health, port: 9030 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 9030 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: published
          secret:
            secretName: agent-published-key
            # The public document only. The operator serves a directory; it
            # has no use for the private half and is not given it.
            items:
              - { key: agent-jwks.json, path: agent-jwks.json }
