# The parties, as namespaces.
#
# FedAuthz §1.4 divides responsibility between the resource owner, the
# resource server and the authorization server — between *parties*, not
# processes. The compose stack collapses all of them onto one Docker network,
# which is exactly the thing docs/ARCHITECTURE.md argues against, and the
# seam survives there only as prose.
#
# Here it is structural. Each party gets a namespace, each workload gets its
# own ServiceAccount, and ztunnel gives every one of them a cryptographic
# identity of the form spiffe://cluster.local/ns/<ns>/sa/<sa>. The policies in
# ../policy then express the boundary in terms of those identities rather
# than in terms of who happens to be able to reach whom.
#
# The headline the whole exercise is for: sterling-vance has no path into
# alice or meridian at all. Bob's agent reaches the resource server the same
# way any caller on the internet would — through the edge — and that is
# enforced by identity rather than by hope.
#
# `alice` and `carol` are two of the same kind, and `northwind` is the third:
# an owner that is a company. It holds resources of its own, shares them with
# members, and sets policy over them — while the members administer access
# under authorities it does not run and cannot read. An owner is a namespace
# holding an authority, a key and a record; adding one is copying a directory
# and changing a name. What
# they are deployed *on* differs — Alice's authority is replicated over a
# synchronous Postgres cluster, Carol's is a single process holding its own
# state — and that difference is invisible from outside, which is the claim
# in docs/MULTI-OWNER.md and the reason an authority can be a person's own
# rather than an institution's.
#
# Every namespace is labelled for ambient mode. There are no sidecars: a
# workload is enrolled by its namespace label and nothing is injected into
# the pod, which is why the vault can be an unmodified MCP server and still
# be inside the mesh.
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      The public on-ramp. Everything from outside arrives here first.
  name: uma-edge
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: edge
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      Alice: her identity, her authorization server, her policy, her portal.
  name: alice
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: resource-owner
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      Carol: the same, and separately. Another customer of the same firm, with her own authority that firm was never configured against.
  name: carol
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: resource-owner
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      Northwind Capital: the third kind of owner. Not a person — a company that owns resources, shares them with the people who work on them, and sets policy over them that none of those people can waive.
  name: northwind
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    # A resource owner like the two above, and deliberately labelled the
    # same. What differs is not the role it plays in the protocol — it owns
    # resources and decides about them — but that the deciding is done by an
    # administrator on the organization's behalf, and that what it owns is
    # shared with members who administer access to it under their own
    # authorities. UMA has always called that a resource rights
    # administrator; this is the namespace where it becomes deployable.
    u4a.ai/party: resource-owner
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      The party that counts verdicts over a jointly held resource. In neither owner's namespace for the same reason the identity provider is in neither: a resource both of them hold cannot have its decision made somewhere that belongs to one of them. It holds no policy and is not trusted — the grants it signs carry the owners' own signed verdicts, and the enforcement point re-runs the count.
  name: tally
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: tally
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      An identity provider, in neither owner's namespace because it is neither owner's. Each has a realm in it and neither can mint the other.
  name: idp
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: identity-provider
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      Meridian Wealth. A different legal entity that holds Alice's assets: it enforces her policy and can never read it.
  name: meridian
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: resource-server
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      Bob's firm and its agent. Has no path into alice or meridian except through the edge.
  name: sterling-vance
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: requesting-party
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      A third-party identity authority, neither Alice's nor Bob's, that both sides resolve rather than trust each other about.
  name: aauth
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: identity-authority
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      Logs and dashboards. Sees protocol events, never grant state.
  name: observability
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    u4a.ai/party: operator-plane
---
# The platform namespaces that this lab's policies name.
#
# CloudNativePG's operator has to reach the database instances to run a
# failover, and the rule that permits it names its ServiceAccount — which
# only matches if it has an identity to match on. Enrolled for that reason
# and no other; nothing here is a workload of the lab.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    u4a.ai/description: >-
      CloudNativePG's operator. In the mesh so the policy protecting Alice's
      database can name it.
  name: cnpg-system
  labels:
    istio.io/dataplane-mode: ambient
