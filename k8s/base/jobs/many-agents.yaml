# Many agents, one policy.
#
# `make k8s-load` races callers at the deployment to prove a single-use grant
# is spent once. This proves something different and, for the argument this
# lab makes, more important: that Alice's side scales to an unbounded
# number of *distinct requesting parties* without her configuring any of them.
#
# The claim under test is that a pseudonymous agent is its key. N agents with
# N keys must be N parties — each pending on first contact because she has met
# none of them, each ending up with its own connection, and revoking one must
# leave the rest alone. If connections were keyed by anything coarser, or if
# her policy named agents rather than resources, this is where it would show.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: many-agents
  namespace: sterling-vance
data:
  many_agents.py: |
    """N agents, N keys, N connections."""
    import concurrent.futures as cf
    import json
    import os
    import sys

    import httpx

    from uma4a_grant import AgentKeys, GrantDenied, run_grant

    AS = os.environ.get("UMA_AS_PUBLIC", "https://alice-as.uma.lab")
    GW = os.environ.get("UMA_GATEWAY", "https://gateway.uma.lab")
    OIDC = os.environ.get("OIDC_ISSUER", "https://keycloak.uma.lab/realms/alice")
    CA = os.environ.get("UMA4A_CA_BUNDLE", "/certs/rootCA.pem")
    N = int(sys.argv[1]) if len(sys.argv) > 1 else 12

    failures = []

    def check(ok, label, detail=""):
        print(("  ok   " if ok else "  FAIL ") + label + (f" — {detail}" if detail and not ok else ""))
        if not ok:
            failures.append(label)

    client = httpx.Client(verify=CA, timeout=30.0)

    # --- Alice, for the taps and for the count ---------------------------
    # The same direct-access grant the demo driver uses when it simulates her.
    # She is needed here for a reason worth noticing: every one of these
    # agents is a stranger, so every one of them pends.
    def owner_token():
        r = client.post(f"{OIDC}/protocol/openid-connect/token",
                        data={"grant_type": "password", "client_id": "meridian-portal",
                              "username": os.environ.get("ALICE_USER", "alice"),
                              "password": os.environ.get("ALICE_PASS", "alice-demo")})
        r.raise_for_status()
        return r.json()["access_token"]

    def owner(method, path, **kw):
        return client.request(method, f"{AS}{path}",
                              headers={"authorization": f"Bearer {owner_token()}"}, **kw)

    def connections():
        r = owner("GET", "/owner/connections")
        r.raise_for_status()
        body = r.json()
        return {c["handle"]: c for c in (body if isinstance(body, list)
                                         else body.get("connections", []))}

    before = connections()
    print(f"\n== {N} agents, each with a key of its own ==")
    print(f"   {len(before)} connection(s) already standing")

    # --- one agent's whole negotiation -----------------------------------
    def negotiate(i):
        """Fresh key, so this is a party Alice has never met."""
        keys = AgentKeys()
        body = {"jsonrpc": "2.0", "id": i, "method": "tools/call",
                "params": {"name": "get_positions", "arguments": {}}}
        r = client.post(f"{GW}/mcp", json=body, headers={
            "mcp-method": "tools/call", "mcp-name": "get_positions",
            "mcp-protocol-version": "2026-07-28",
        })
        if r.status_code != 401:
            return keys, None, f"expected a challenge, got {r.status_code}"
        ticket = None
        for part in r.headers.get("WWW-Authenticate", "").split(","):
            part = part.strip()
            if part.startswith("ticket="):
                ticket = part.split("=", 1)[1].strip('"')
        if not ticket:
            ticket = r.json().get("ticket")
        if not ticket:
            return keys, None, "challenged with no ticket"
        try:
            rpt = run_grant(client, AS, ticket, keys,
                            approve_terms=lambda t: True, max_wait_s=90)
            return keys, rpt, None
        except GrantDenied as exc:
            return keys, None, str(exc)

    # Alice approves whatever is waiting, in the background, while the agents
    # negotiate. Every first contact pends — that is the point — so without
    # her nothing here completes.
    stop = False

    def tap():
        while not stop:
            try:
                r = owner("GET", "/owner/pending")
                for p in (r.json() if isinstance(r.json(), list)
                          else r.json().get("pending", [])):
                    owner("POST", f"/owner/pending/{p['family']}/decision",
                          json={"decision": "approved"})
            except Exception:
                pass

    with cf.ThreadPoolExecutor(max_workers=N + 1) as pool:
        tapper = pool.submit(tap)
        results = list(pool.map(negotiate, range(N)))
        stop = True

    granted = [(k, rpt) for k, rpt, err in results if rpt]
    errs = [err for _, _, err in results if err]
    check(len(granted) == N, f"all {N} negotiated a grant",
          f"{len(granted)} of {N}; first error: {errs[0] if errs else '-'}")

    # --- the assertions that matter --------------------------------------
    thumbs = {json.dumps(k.public_jwk(), sort_keys=True) for k, _ in granted}
    check(len(thumbs) == len(granted), "every agent used a distinct key",
          f"{len(thumbs)} distinct of {len(granted)}")

    after = connections()
    added = set(after) - set(before)
    check(len(added) == N, f"Alice's side recorded {N} new connections",
          f"recorded {len(added)}")

    # One policy governed all of them. Nothing was added per agent.
    pol = owner("GET", "/owner/policies")
    check(pol.status_code == 200 and json.dumps(pol.json()).count("tier") > 0,
          "her policy still names tiers, not agents")

    # --- revocation is per-agent ------------------------------------------
    if added:
        victim = sorted(added)[0]
        owner("POST", f"/owner/connections/{victim}/revoke")
        left = connections()
        check(victim not in left or left[victim].get("revoked"),
              "revoking one agent removes that one")
        survivors = [h for h in added if h != victim
                     and h in left and not left[h].get("revoked")]
        check(len(survivors) == len(added) - 1,
              "and leaves every other agent standing",
              f"{len(survivors)} of {len(added) - 1} survived")

    print(f"\nk8s-many-agents: {4 + (2 if added else 0) - len(failures)} passed, "
          f"{len(failures)} failed")
    sys.exit(1 if failures else 0)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: many-agents
  namespace: sterling-vance
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: many-agents }
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: many-agents
          image: localhost:5001/u4a/uma-as:dev
          imagePullPolicy: Always
          command: ["python3", "/script/many_agents.py", "12"]
          env:
            # The grant helpers come from the demo-lib ConfigMap that
            # k8s/scripts/job-configmaps.sh builds out of lib/, the same way
            # the demo driver gets them — so this exercises the tree, not a
            # copy baked into an image. The uma-as image carries only
            # uma4a_http_sig.py, which is not enough to be an agent.
            - { name: PYTHONPATH, value: "/lib" }
            - { name: UMA4A_CA_BUNDLE, value: "/certs/rootCA.pem" }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: lib, mountPath: /lib, readOnly: true }
            - { name: ca, mountPath: /certs, readOnly: true }
      volumes:
        - name: script
          configMap: { name: many-agents }
        - name: lib
          configMap: { name: demo-lib }
        - name: ca
          configMap: { name: uma-lab-ca-bundle }
