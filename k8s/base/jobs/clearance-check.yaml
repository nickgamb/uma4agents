# What an operation leaves behind — in the cluster.
#
# The same clients/demo-driver/clearance_check.py the compose stack runs,
# from Bob's namespace, so the declaration is followed the whole way through
# the real path: the vault states it, the enforcement point publishes it in
# the metadata it signs, her authorization server pulls it into her registry,
# and a rule she wrote reads it there.
#
# Worth running here rather than only under compose, for the same reason
# intent-check is: her registry is a pull into a replicated server, so "the
# class her policy read is the class the resource published" stops being an
# assumption about one process.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clearance-check
  namespace: sterling-vance
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: clearance-check }
    spec:
      restartPolicy: Never
      serviceAccountName: agent
      containers:
        - name: clearance-check
          image: localhost:5001/u4a/uma-as:dev
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              pip install -q httpx 'pyjwt[crypto]' 2>/dev/null
              exec python3 /driver/clearance_check.py
          env:
            # The same plain value org-check is given: this is a lab
            # credential, and inventing a Secret here that the cluster does
            # not provision would fail the job before it ran a line.
            - { name: UMA4A_ORG, value: https://northwind-org.uma.lab }
            - { name: UMA4A_AGENT_OPERATOR, value: "https://agent.uma.lab" }
            - name: UMA4A_OPERATOR_REGISTER_TOKEN
              valueFrom: { secretKeyRef: { name: operator-register, key: token } }
            # The private half of a key Bob's operator already publishes. It
            # provisions its directory and refuses a key registered at runtime,
            # so an agent that wants to be attributable here signs with a key
            # that operator issued. Without this the agent tops out at
            # accountability 1 and the firm's charter, which requires 2,
            # refuses it before the clearance is ever reached. Absent under
            # compose, where the operator accepts a key at runtime.
            - { name: UMA4A_PUBLISHED_KEYS, value: /published }
            - name: PYTHONPATH
              value: /driver/lib
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: UMA4A_CACERT
              value: /certs/rootCA.pem
          volumeMounts:
            - { name: driver, mountPath: /driver/clearance_check.py, subPath: clearance_check.py, readOnly: true }
            - { name: lib, mountPath: /driver/lib, readOnly: true }
            - { name: ca, mountPath: /certs, readOnly: true }
            - { name: published, mountPath: /published, readOnly: true }
            - { name: keys, mountPath: /driver/keys }
          workingDir: /driver
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: driver
          configMap: { name: demo-driver }
        - name: lib
          configMap: { name: demo-lib }
        - name: ca
          configMap: { name: uma-lab-ca-bundle }
        - name: published
          secret:
            secretName: agent-published-key
            items:
              - { key: attested-ed25519.pem, path: attested-ed25519.pem }
        - name: keys
          emptyDir: {}
