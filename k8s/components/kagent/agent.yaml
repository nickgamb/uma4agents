# Bob's agent, as an agent framework rather than a script.
#
# Everything else in this lab drives the grant from code we wrote: the demo
# driver, the shim beside Claude Code, Alice's personal AI. This is the case
# that matters most for adoption and least for the protocol — an agent platform
# nobody modified, pointed at Alice's resources, and governed by her policy
# anyway.
#
# It knows nothing about UMA. It sees three ordinary MCP tools. Everything that
# makes those tools reachable — the challenge, the terms, the signed agreement,
# the proof-of-possession key, the single-use grant — happens inside the
# agent-shim it is pointed at, in Bob's namespace, holding Bob's key.
#
# That is the claim worth checking: the requesting side needs an adapter, not a
# rewrite. See docs/KAGENT.md.
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: alice-vault-via-uma
  namespace: sterling-vance
spec:
  description: >-
    Alice's brokerage tools, reached through the U4A adapter. The adapter runs
    the four-beat grant; this agent sees ordinary MCP.
  protocol: STREAMABLE_HTTP
  url: http://agent-shim.sterling-vance.svc.cluster.local:9030/mcp
  timeout: 120s
  # Alice's ask-me tier holds a request while she decides, which from an
  # agent's side is simply a slow tool call.
  sseReadTimeout: 300s
  # The adapter is deliberately stateless — the continuity of a negotiation
  # lives in the permission ticket at Alice's authority, not in a session on
  # this hop. So there is no session to terminate, and a client that tries
  # gets a 405 on an otherwise clean run. Tell it not to bother.
  terminateOnClose: false
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: advisory-agent
  namespace: sterling-vance
spec:
  type: Declarative
  description: Sterling & Vance's advisory agent, acting for Bob.
  declarative:
    modelConfig: u4a-model
    systemMessage: |
      You are an advisory agent working for Bob at Sterling & Vance. You may
      look at the account's holdings and transactions, and you may propose
      trades against it.

      The account's authorization server decides what you actually get, and
      the people who own it are not sitting at a keyboard waiting for you.

      If a tool returns PENDING, the owner has been asked and has not answered
      yet. That is a normal state, not an error and not a refusal. Report that
      the request is waiting on her decision, and stop for now. Do NOT call the
      tool again in the same reply and do not wait in a loop — whoever asked
      you will ask again, and your next turn will pick the same request back
      up. She may take hours.

      If a tool tells you the request was declined, say so plainly and stop.
      Do not retry a refusal, and never change the request to get a different
      answer.

      Use one tool per question and report what it returned.

    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: alice-vault-via-uma
          toolNames: [get_positions, get_transactions, execute_trade]
