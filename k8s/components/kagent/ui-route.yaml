# kagent's own UI at https://kagent.uma.lab, so Bob's agent can be driven from
# a browser beside Alice's portal. The edge terminates TLS with the lab's
# wildcard certificate and hands every request to kagent's oauth2-proxy, which
# signs Bob in against his realm before anything reaches the UI
# (sso-values.yaml). The UI is kagent's, unmodified.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-ui
  namespace: kagent
spec:
  parentRefs:
    - name: edge
      namespace: uma-edge
  hostnames:
    - kagent.uma.lab
  rules:
    # A chat is one long response: the agent's tool call can be held while
    # Alice decides (up to 90s at the adapter) before the model answers. The
    # edge's default 15s would cut it mid-answer, so the route allows what
    # kagent's own UI allows a stream (ui.streamTimeoutSeconds, 1800).
    - timeouts:
        request: 1800s
        backendRequest: 1800s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagent-oauth2-proxy
          port: 4180
