<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- agent assurance — three kinds of evidence, one answer, and which way
       each kind is allowed to move it.
       Colour: site/src/style/theme.js · brand direction 1b -->
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf6a6a"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bcdb2c"/>
    </marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bcdb2c"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#0a0b0d"/>

  <!-- header -->
  <g transform="translate(40 26) scale(0.53125)">
    <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="15" fill="#0a0b0d" stroke="#8cc2d4" stroke-width="2.8"/>
    <g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 17 L11 33 A5.75 5.75 0 0 0 22.5 33 L22.5 17" stroke="#ffffff"/>
      <path d="M34.5 17 L26.25 31 L37.75 31 M34.5 17 L34.5 39" stroke="#bcdb2c"/>
      <path d="M41.5 39 L47.25 17 L53 39 M43.5 31.5 L51 31.5" stroke="#ffffff"/>
    </g>
  </g>
  <text x="92" y="46" fill="#ffffff" font-size="21" font-weight="600">Agent assurance</text>
  <text x="92" y="68" fill="#757b83" font-size="14.5">Three kinds of evidence, one answer — and which way each kind is allowed to move it.</text>

  <!-- ================= band 1: what the agent can show ===================== -->
  <text x="40" y="118" fill="#8cc2d4" font-size="12.5" letter-spacing="1.6" font-weight="600">WHAT THE AGENT CAN SHOW &#183; ASSURANCE</text>
  <text x="40" y="139" fill="#757b83" font-size="13">Attested by the requesting side, or by an issuer she never chose. Three axes, never added up.</text>

  <g fill="#0f1114" stroke="#8cc2d4" stroke-width="1.6">
    <rect x="40" y="156" width="352" height="98" rx="10"/>
    <rect x="416" y="156" width="352" height="98" rx="10"/>
    <rect x="792" y="156" width="368" height="98" rx="10"/>
  </g>

  <text x="62" y="182" fill="#ffffff" font-size="15" font-weight="600">binding</text>
  <text x="62" y="204" fill="#9aa2ab" font-size="12.5">Will she recognise this key next time?</text>
  <text x="62" y="228" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 &#183; signed request, key she can name</text>
  <text x="62" y="245" fill="#5d646c" font-size="11.5">never 0 here — the grant requires it</text>

  <text x="438" y="182" fill="#ffffff" font-size="15" font-weight="600">provenance</text>
  <text x="438" y="204" fill="#9aa2ab" font-size="12.5">Can she check where the credential came from?</text>
  <text x="438" y="228" fill="#5d646c" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 &#183; self-minted key</text>
  <text x="438" y="245" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 &#183; issuer signature verified</text>

  <text x="814" y="182" fill="#ffffff" font-size="15" font-weight="600">accountability</text>
  <text x="814" y="204" fill="#9aa2ab" font-size="12.5">Is anyone named and reachable behind it?</text>
  <text x="814" y="228" fill="#5d646c" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 none &#160;&#183;&#160; 1 the operator says so</text>
  <text x="814" y="245" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2 the operator published this key</text>

  <!-- one-way arrows down onto the track -->
  <g stroke="#cf6a6a" stroke-width="2" fill="none">
    <path d="M216 258 V286"/>
    <path d="M592 258 V286"/>
    <path d="M976 258 V286"/>
    <path d="M216 286 H976"/>
    <path d="M596 286 V302" marker-end="url(#aR)"/>
  </g>
  <rect x="466" y="310" width="268" height="26" rx="13" fill="#1a1114" stroke="#cf6a6a" stroke-width="1.4"/>
  <text x="600" y="328" fill="#cf6a6a" font-size="13" text-anchor="middle" font-weight="600">may only move it stricter &#8594;</text>

  <!-- ================= the answer ========================================== -->
  <text x="40" y="384" fill="#ffffff" font-size="12.5" letter-spacing="1.6" font-weight="600">WHAT THIS REQUEST NEEDS</text>

  <line x1="150" y1="440" x2="1050" y2="440" stroke="#2a2f36" stroke-width="3"/>

  <!-- auto -->
  <circle cx="270" cy="440" r="13" fill="#0a0b0d" stroke="#bcdb2c" stroke-width="3"/>
  <text x="270" y="415" fill="#bcdb2c" font-size="16" font-weight="600" text-anchor="middle">grant quietly</text>
  <text x="270" y="475" fill="#757b83" font-size="12.5" text-anchor="middle">her policy already answered</text>
  <!-- ask -->
  <circle cx="600" cy="440" r="13" fill="#0a0b0d" stroke="#e2b23c" stroke-width="3"/>
  <text x="600" y="415" fill="#e2b23c" font-size="16" font-weight="600" text-anchor="middle">ask her</text>
  <text x="600" y="475" fill="#757b83" font-size="12.5" text-anchor="middle">the request waits, holding its ticket</text>
  <!-- refuse -->
  <circle cx="930" cy="440" r="13" fill="#0a0b0d" stroke="#cf6a6a" stroke-width="3"/>
  <text x="930" y="415" fill="#cf6a6a" font-size="16" font-weight="600" text-anchor="middle">refuse</text>
  <text x="930" y="475" fill="#757b83" font-size="12.5" text-anchor="middle">it never reaches her at all</text>

  <text x="1064" y="445" fill="#5d646c" font-size="12.5">stricter</text>

  <!-- ================= band 2 and 3: her side ============================== -->
  <text x="40" y="540" fill="#bcdb2c" font-size="12.5" letter-spacing="1.6" font-weight="600">WHAT HER OWN AUTHORITY HAS &#183; STANDING</text>
  <text x="40" y="561" fill="#757b83" font-size="13">Split again, because only one half of it may make a request easier.</text>

  <rect x="40" y="578" width="540" height="112" rx="10" fill="#0f1114" stroke="#3d444d" stroke-width="1.6"/>
  <text x="62" y="604" fill="#ffffff" font-size="15" font-weight="600">what this server did</text>
  <text x="62" y="626" fill="#9aa2ab" font-size="12.5">granted here before &#183; never seen &#183; revoked before</text>
  <text x="62" y="652" fill="#cf6a6a" font-size="12.5" font-weight="600">may only move it stricter &#8594;</text>
  <text x="62" y="672" fill="#5d646c" font-size="11.5">relaxing on an automatic grant would let one justify the next</text>

  <rect x="620" y="578" width="540" height="112" rx="10" fill="#0f1114" stroke="#bcdb2c" stroke-width="1.6"/>
  <text x="642" y="604" fill="#ffffff" font-size="15" font-weight="600">what Alice decided herself</text>
  <text x="642" y="626" fill="#9aa2ab" font-size="12.5">she admitted it &#183; she approved at this tier &#183; never revoked</text>
  <text x="642" y="652" fill="#bcdb2c" font-size="12.5" font-weight="600">&#8592; the only evidence that may move it easier &#8594;</text>
  <text x="642" y="672" fill="#5d646c" font-size="11.5">the one kind the requesting side had no hand in producing</text>

  <g stroke="#cf6a6a" stroke-width="2" fill="none" marker-end="url(#aR)">
    <path d="M310 578 V500 H586"/>
  </g>
  <g stroke="#bcdb2c" stroke-width="2" fill="none">
    <path d="M890 578 V518"/>
    <path d="M890 518 H700"/>
    <path d="M700 518 H614" marker-end="url(#aG)"/>
    <path d="M700 518 H820" marker-end="url(#aGr)"/>
  </g>

  <!-- ================= the payoff ========================================== -->
  <line x1="40" y1="716" x2="1160" y2="716" stroke="#2a2f36" stroke-width="1"/>
  <text x="40" y="748" fill="#bcdb2c" font-size="17" font-weight="600">A lie can only cost the liar friction.</text>
  <text x="404" y="748" fill="#757b83" font-size="13.5">Which is why her policy can safely read what an agent says about itself — and why none of this needs a registry.</text>
</svg>
