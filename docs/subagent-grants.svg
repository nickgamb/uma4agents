<svg viewBox="0 0 1800 1350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- subagent=grants — the shape, with what is on the wire at each beat.
       Paint order is deliberate: boxes, then connectors, then every label last,
       so no line is ever drawn over text.
       Colour: site/src/style/theme.js -->
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8cc2d4"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bcdb2c"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8836b"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f97"/>
    </marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c586c0"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .k { fill: #9cdcfe; } .s { fill: #ce9178; } .n { fill: #b5cea8; }
    .c { fill: #6a9955; } .p { fill: #d4d4d4; } .kw { fill: #c586c0; } .ok { fill: #bcdb2c; }
  </style>

  <rect width="1800" height="1350" fill="#0a0b0d"/>

  <!-- ===== boxes ===== -->
  <g>
    <rect x="80" y="110" width="710" height="590" rx="12" fill="none" stroke="#5e8fa3" stroke-width="1.4" stroke-dasharray="7 5"/>
    <rect x="1110" y="110" width="610" height="590" rx="12" fill="none" stroke="#bcdb2c" stroke-width="1.4" stroke-dasharray="7 5"/>

    <rect x="110" y="166" width="650" height="78" rx="10" fill="#121317" stroke="#3a4a52" stroke-width="1.4"/>
    <rect x="110" y="300" width="380" height="112" rx="10" fill="#121317" stroke="#5e8fa3" stroke-width="1.6"/>
    <rect x="110" y="498" width="380" height="116" rx="10" fill="#121317" stroke="#5e8fa3" stroke-width="1.6"/>
    <rect x="516" y="300" width="254" height="170" rx="10" fill="#121317" stroke="#7c5b86" stroke-width="1.4"/>

    <rect x="1140" y="160" width="550" height="146" rx="10" fill="#121317" stroke="#3a4a52" stroke-width="1.4"/>
    <rect x="1140" y="346" width="550" height="150" rx="10" fill="#121317" stroke="#bcdb2c" stroke-width="1.6"/>
    <rect x="1140" y="562" width="550" height="112" rx="10" fill="#121317" stroke="#3a4a52" stroke-width="1.4"/>

    <rect x="560" y="820" width="680" height="120" rx="12" fill="#121317" stroke="#3a4a52" stroke-width="1.6"/>
    <rect x="600" y="894" width="170" height="32" rx="6" fill="#0d0f13" stroke="#2d3138"/>
    <rect x="790" y="894" width="220" height="32" rx="6" fill="#0d0f13" stroke="#2d3138"/>
    <rect x="1030" y="894" width="170" height="32" rx="6" fill="#0d0f13" stroke="#2d3138"/>

    <rect x="80" y="980" width="540" height="320" rx="8" fill="#1b1d21" stroke="#2d3036" stroke-width="1.2"/>
    <rect x="80" y="980" width="540" height="26" rx="8" fill="#232529"/>
    <rect x="80" y="998" width="540" height="8" fill="#232529"/>
    <rect x="630" y="980" width="540" height="320" rx="8" fill="#1b1d21" stroke="#2d3036" stroke-width="1.2"/>
    <rect x="630" y="980" width="540" height="26" rx="8" fill="#232529"/>
    <rect x="630" y="998" width="540" height="8" fill="#232529"/>
    <rect x="1180" y="980" width="540" height="320" rx="8" fill="#1b1d21" stroke="#2d3036" stroke-width="1.2"/>
    <rect x="1180" y="980" width="540" height="26" rx="8" fill="#232529"/>
    <rect x="1180" y="998" width="540" height="8" fill="#232529"/>
    <circle cx="98" cy="993" r="3.5" fill="#e8836b"/><circle cx="110" cy="993" r="3.5" fill="#f2b955"/><circle cx="122" cy="993" r="3.5" fill="#bcdb2c"/>
    <circle cx="648" cy="993" r="3.5" fill="#e8836b"/><circle cx="660" cy="993" r="3.5" fill="#f2b955"/><circle cx="672" cy="993" r="3.5" fill="#bcdb2c"/>
    <circle cx="1198" cy="993" r="3.5" fill="#e8836b"/><circle cx="1210" cy="993" r="3.5" fill="#f2b955"/><circle cx="1222" cy="993" r="3.5" fill="#bcdb2c"/>
  </g>

  <!-- ===== connectors ===== -->
  <g>
    <line x1="300" y1="412" x2="300" y2="494" stroke="#8cc2d4" stroke-width="2" marker-end="url(#t)"/>
    <path d="M600 474 L600 486 L462 486 L462 494" fill="none" stroke="#c586c0" stroke-width="2" marker-end="url(#v)"/>
    <path d="M490 530 L830 530 L830 400 L1136 400" fill="none" stroke="#8cc2d4" stroke-width="2" marker-end="url(#t)"/>
    <path d="M1136 452 L890 452 L890 580 L494 580" fill="none" stroke="#bcdb2c" stroke-width="2" marker-end="url(#g)"/>
    <line x1="1415" y1="558" x2="1415" y2="500" stroke="#8a8f97" stroke-width="1.6" marker-end="url(#w)"/>
    <line x1="1415" y1="310" x2="1415" y2="342" stroke="#8a8f97" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#w)"/>
    <path d="M300 614 L300 880 L556 880" fill="none" stroke="#8a8f97" stroke-width="1.8" marker-end="url(#w)"/>
    <path d="M1415 678 L1415 880 L1244 880" fill="none" stroke="#e8836b" stroke-width="2" marker-end="url(#r)"/>
  </g>

  <!-- ===== labels ===== -->
  <g>
    <text x="900" y="56" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">Sub-agent grants</text>

    <text x="106" y="142" fill="#8cc2d4" font-size="13" font-weight="700" letter-spacing="1.4">BOB'S DOMAIN — ONE OPERATOR</text>
    <text x="1136" y="142" fill="#bcdb2c" font-size="13" font-weight="700" letter-spacing="1.4">ALICE'S DOMAIN</text>

    <text x="134" y="198" fill="#ffffff" font-size="16" font-weight="650">Operator key directory</text>
    <text x="134" y="224" fill="#757b83" font-size="13">publishes both agents' keys — the agents cannot write to it</text>

    <text x="134" y="334" fill="#ffffff" font-size="18" font-weight="650">Parent agent</text>
    <text x="134" y="360" fill="#a9aeb6" font-size="13.5">its own key · proof-of-possession</text>
    <text x="134" y="384" fill="#bcdb2c" font-size="13.5">Alice approved it at tier 1</text>

    <text x="134" y="532" fill="#ffffff" font-size="18" font-weight="650">Sub-agent</text>
    <text x="134" y="558" fill="#a9aeb6" font-size="13.5">its own key · never the parent's</text>
    <text x="134" y="582" fill="#757b83" font-size="13.5">arrives with a lineage, nothing else</text>

    <text x="538" y="332" fill="#ffffff" font-size="16" font-weight="650">Agent server</text>
    <text x="538" y="354" fill="#8a8f97" font-size="12.5">the operator's AAuth issuer</text>
    <text x="538" y="384" fill="#a9aeb6" font-size="12.5">issues the sub-agent's</text>
    <text x="538" y="402" fill="#a9aeb6" font-size="12" font-family="ui-monospace, Menlo, monospace">aa-agent+jwt</text>
    <text x="538" y="428" fill="#c586c0" font-size="12.5">and names the parent</text>
    <text x="538" y="446" fill="#c586c0" font-size="12.5">in its <tspan font-family="ui-monospace, Menlo, monospace">act</tspan> claim</text>

    <text x="322" y="440" fill="#ffffff" font-size="13.5" font-weight="700">1a</text>
    <text x="346" y="440" fill="#8cc2d4" font-size="13">the parent signs</text>
    <text x="322" y="458" fill="#8cc2d4" font-size="13">an introduction</text>
    <text x="322" y="478" fill="#757b83" font-size="12">names one key ·</text>
    <text x="322" y="494" fill="#757b83" font-size="12">confers nothing</text>

    <text x="612" y="496" fill="#c586c0" font-size="12.5" font-weight="650">1b · or its issuer says so</text>

    <text x="1164" y="194" fill="#ffffff" font-size="16" font-weight="650">Her terms</text>
    <text x="1164" y="222" fill="#bcdb2c" font-size="13">tier 1 · holdings</text>
    <text x="1400" y="222" fill="#757b83" font-size="12.5">approved for this fleet</text>
    <text x="1164" y="248" fill="#a9aeb6" font-size="13">tier 2 · transactions</text>
    <text x="1400" y="248" fill="#757b83" font-size="12.5">never asked for yet</text>
    <text x="1164" y="274" fill="#f2b955" font-size="13">tier 3 · trades</text>
    <text x="1400" y="274" fill="#757b83" font-size="12.5">ask me every time</text>
    <text x="1164" y="296" fill="#6c727a" font-size="12">she decides per tier: ask about every agent, once per fleet, or always about sub-agents</text>

    <text x="858" y="336" fill="#ffffff" font-size="14" font-weight="700">2</text>
    <text x="876" y="336" fill="#8cc2d4" font-size="13.5">its own contract, signed</text>
    <text x="876" y="356" fill="#8cc2d4" font-size="13.5">with its own key, carrying</text>
    <text x="876" y="376" fill="#8cc2d4" font-size="13.5">the lineage</text>

    <text x="1164" y="384" fill="#ffffff" font-size="18" font-weight="650">Alice's authorization server</text>
    <text x="1164" y="412" fill="#a9aeb6" font-size="13.5">the only thing that decides</text>
    <text x="1164" y="438" fill="#757b83" font-size="13">checks every claim against her own records</text>
    <text x="1164" y="462" fill="#757b83" font-size="13">a sponsor she approved in person · one operator</text>
    <text x="1164" y="484" fill="#757b83" font-size="13">not revoked · not itself a sub-agent</text>

    <text x="600" y="732" fill="#ffffff" font-size="14" font-weight="700">3</text>
    <text x="618" y="732" fill="#bcdb2c" font-size="13.5">its own grant — bound to its own key</text>
    <text x="600" y="754" fill="#757b83" font-size="12.5">purpose-bound · expiring · separately revocable</text>
    <text x="600" y="774" fill="#f2b955" font-size="12.5">a tier the lineage never reached still asks her</text>

    <text x="1164" y="598" fill="#ffffff" font-size="18" font-weight="650">Alice</text>
    <text x="1164" y="624" fill="#a9aeb6" font-size="13.5">portal: approve · revoke · audit</text>
    <text x="1164" y="648" fill="#757b83" font-size="13">asked once per fleet, per tier</text>
    <text x="1435" y="536" fill="#8a8f97" font-size="12.5">writes her terms</text>

    <text x="352" y="654" fill="#8a8f97" font-size="12.5">calls the tool,</text>
    <text x="352" y="674" fill="#8a8f97" font-size="12.5">signing the request</text>

    <text x="1435" y="820" fill="#ffffff" font-size="14" font-weight="700">4</text>
    <text x="1453" y="820" fill="#e8836b" font-size="13.5">she revokes the parent</text>
    <text x="1435" y="842" fill="#757b83" font-size="12.5">its sub-agents go in the</text>
    <text x="1435" y="862" fill="#757b83" font-size="12.5">same action · their grants</text>
    <text x="1435" y="882" fill="#757b83" font-size="12.5">fail on the next call</text>

    <text x="900" y="854" fill="#ffffff" font-size="18" font-weight="650" text-anchor="middle">MCP gateway + resource server</text>
    <text x="900" y="878" fill="#a9aeb6" font-size="13.5" text-anchor="middle">enforcement point — introspects at her authority on every call</text>
    <text x="685" y="915" fill="#757b83" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">get_positions</text>
    <text x="900" y="915" fill="#757b83" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">get_transactions</text>
    <text x="1115" y="915" fill="#757b83" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">execute_trade</text>

    <text xml:space="preserve" x="138" y="998" fill="#757b83" font-size="11" class="mono">1 · proving the lineage — two ways</text>
    <text xml:space="preserve" x="102" y="1032" class="mono c">// 1a · pseudonymous: the parent signs</text>
    <text xml:space="preserve" x="102" y="1050" class="mono"><tspan class="p">{ </tspan><tspan class="k">"typ"</tspan><tspan class="p">: </tspan><tspan class="s">"u4a-introduction-v1+jws"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="102" y="1068" class="mono"><tspan class="p">  </tspan><tspan class="k">"jwk"</tspan><tspan class="p">: { …the parent's key… } }</tspan></text>
    <text xml:space="preserve" x="102" y="1086" class="mono"><tspan class="p">{ </tspan><tspan class="k">"sub"</tspan><tspan class="p">: </tspan><tspan class="s">"jkt:8f2c…"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="102" y="1104" class="mono"><tspan class="p">  </tspan><tspan class="k">"aud"</tspan><tspan class="p">: </tspan><tspan class="s">"https://alice-as.uma.lab"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="102" y="1122" class="mono"><tspan class="p">  </tspan><tspan class="k">"exp"</tspan><tspan class="p">: </tspan><tspan class="n">1757538120</tspan><tspan class="p"> }</tspan></text>
    <text xml:space="preserve" x="102" y="1156" class="mono c">// 1b · identified: its issuer says so</text>
    <text xml:space="preserve" x="102" y="1174" class="mono"><tspan class="p">{ </tspan><tspan class="k">"typ"</tspan><tspan class="p">: </tspan><tspan class="s">"aa-agent+jwt"</tspan><tspan class="p">, … }</tspan></text>
    <text xml:space="preserve" x="102" y="1192" class="mono"><tspan class="p">{ </tspan><tspan class="k">"iss"</tspan><tspan class="p">: </tspan><tspan class="s">"https://ps.uma.lab"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="102" y="1210" class="mono"><tspan class="p">  </tspan><tspan class="k">"sub"</tspan><tspan class="p">: </tspan><tspan class="s">"worker-7@ps.uma.lab"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="102" y="1228" class="mono"><tspan class="p">  </tspan><tspan class="k">"cnf"</tspan><tspan class="p">: { </tspan><tspan class="k">"jwk"</tspan><tspan class="p">: { …</tspan><tspan class="s">jkt:8f2c…</tspan><tspan class="p"> } },</tspan></text>
    <text xml:space="preserve" x="102" y="1246" class="mono"><tspan class="p">  </tspan><tspan class="kw">"act"</tspan><tspan class="p">: { </tspan><tspan class="k">"sub"</tspan><tspan class="p">: </tspan><tspan class="s">"lead-1@ps.uma.lab"</tspan><tspan class="p"> } }</tspan></text>
    <text xml:space="preserve" x="102" y="1272" class="mono c">// RFC 8693 act, as AAuth already uses it —</text>
    <text xml:space="preserve" x="102" y="1288" class="mono c">// the operator's issuer asserts the lineage</text>

    <text xml:space="preserve" x="688" y="998" fill="#757b83" font-size="11" class="mono">2 · what her authority looks up</text>
    <text xml:space="preserve" x="652" y="1032" class="mono c">// the sponsor's connection, in her store</text>
    <text xml:space="preserve" x="652" y="1056" class="mono"><tspan class="k">"handle"</tspan><tspan class="p">: </tspan><tspan class="s">"jkt:41ab…"</tspan></text>
    <text xml:space="preserve" x="652" y="1074" class="mono"><tspan class="k">"status"</tspan><tspan class="p">: </tspan><tspan class="s">"active"</tspan></text>
    <text xml:space="preserve" x="652" y="1092" class="mono"><tspan class="k">"tiers_approved"</tspan><tspan class="p">: [</tspan><tspan class="s">"tier1"</tspan><tspan class="p">]</tspan></text>
    <text xml:space="preserve" x="652" y="1110" class="mono"><tspan class="k">"parent_handle"</tspan><tspan class="p">: </tspan><tspan class="kw">null</tspan></text>
    <text xml:space="preserve" x="1090" y="1074" class="mono ok">✓</text>
    <text xml:space="preserve" x="1090" y="1092" class="mono ok">✓</text>
    <text xml:space="preserve" x="1090" y="1110" class="mono ok">✓</text>
    <text xml:space="preserve" x="652" y="1144" class="mono p">one operator published both keys</text>
    <text xml:space="preserve" x="652" y="1162" class="mono p">no revoked record for jkt:8f2c…</text>
    <text xml:space="preserve" x="652" y="1180" class="mono p">live sub-agents 1 of 3 allowed</text>
    <text xml:space="preserve" x="1090" y="1144" class="mono ok">✓</text>
    <text xml:space="preserve" x="1090" y="1162" class="mono ok">✓</text>
    <text xml:space="preserve" x="1090" y="1180" class="mono ok">✓</text>
    <text xml:space="preserve" x="652" y="1214" class="mono c">// on the act path the issuer is the</text>
    <text xml:space="preserve" x="652" y="1232" class="mono c">// operator, so "one operator" is stronger:</text>
    <text xml:space="preserve" x="652" y="1250" class="mono c">// one issuer signed both credentials.</text>
    <text xml:space="preserve" x="652" y="1280" class="mono c">// any ✗ and it is a stranger again.</text>

    <text xml:space="preserve" x="1238" y="998" fill="#757b83" font-size="11" class="mono">3 · the sub-agent's own grant</text>
    <text xml:space="preserve" x="1202" y="1032" class="mono"><tspan class="p">{</tspan></text>
    <text xml:space="preserve" x="1202" y="1050" class="mono"><tspan class="p">  </tspan><tspan class="k">"iss"</tspan><tspan class="p">: </tspan><tspan class="s">"https://alice-as.uma.lab"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="1202" y="1068" class="mono"><tspan class="p">  </tspan><tspan class="k">"cnf"</tspan><tspan class="p">: { </tspan><tspan class="k">"jwk"</tspan><tspan class="p">: { …</tspan><tspan class="s">jkt:8f2c…</tspan><tspan class="p"> } },</tspan></text>
    <text xml:space="preserve" x="1202" y="1086" class="mono"><tspan class="p">  </tspan><tspan class="k">"scope"</tspan><tspan class="p">: </tspan><tspan class="s">"positions:read"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="1202" y="1104" class="mono"><tspan class="p">  </tspan><tspan class="k">"exp"</tspan><tspan class="p">: </tspan><tspan class="n">1757541600</tspan></text>
    <text xml:space="preserve" x="1202" y="1122" class="mono"><tspan class="p">}</tspan></text>
    <text xml:space="preserve" x="1202" y="1152" class="mono c">// cnf is the SUB-AGENT's key.</text>
    <text xml:space="preserve" x="1202" y="1170" class="mono c">// the parent's grant is untouched,</text>
    <text xml:space="preserve" x="1202" y="1188" class="mono c">// and nothing was inherited.</text>
    <text xml:space="preserve" x="1202" y="1222" class="mono c">// 4 · revoking the parent:</text>
    <text xml:space="preserve" x="1202" y="1244" class="mono"><tspan class="p">{ </tspan><tspan class="k">"connections_revoked"</tspan><tspan class="p">: </tspan><tspan class="n">3</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" x="1202" y="1262" class="mono"><tspan class="p">  </tspan><tspan class="k">"rpts_deactivated"</tspan><tspan class="p">: </tspan><tspan class="n">5</tspan><tspan class="p"> }</tspan></text>
    <text xml:space="preserve" x="1202" y="1288" class="mono c">// their grants fail on the next call</text>
  </g>
</svg>
