# UMA for Agents — the demo stack.
#   make init && make up && make smoke-test
# See docs/ARCHITECTURE.md for the system design.
#
# The tokens/passwords below are LOCAL LAB demo defaults, not secrets. Override
# them via a .env file (see .env.example) and never reuse them anywhere real or
# expose this stack on a public network.

services:
  dns:
    init: true
    image: docker.io/hickorydns/hickory-dns:0.25.2
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./dns/named.toml:/etc/named.toml:ro
      - ./dns/uma.lab.zone:/var/named/uma.lab.zone:ro

  edge:
    init: true
    image: envoyproxy/envoy:v1.34-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    ports:
      - "443:443"
    volumes:
      - ./edge/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs/edge-server.pem:/certs/edge-server.pem:ro
      - ./certs/edge-server-key.pem:/certs/edge-server-key.pem:ro
    networks:
      default:
        aliases:
          - alice-as.uma.lab
          - carol-as.uma.lab
          - keycloak.uma.lab
          - gateway.uma.lab
          - portal.uma.lab
          - carol-portal.uma.lab
          - grafana.uma.lab
          - ps.uma.lab
          - agent.uma.lab
          - alice-agent.uma.lab
          - northwind-org.uma.lab
          - org-console.uma.lab
          - joint-tally.uma.lab

  keycloak:
    init: true
    image: quay.io/keycloak/keycloak:26.4.5
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-uma4agents-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://keycloak.uma.lab
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  uma-as:
    init: true
    build:
      context: .
      dockerfile: services/uma-as/Dockerfile
    environment:
      UMA_AS_RS_RESOURCE_URI: https://gateway.uma.lab/mcp
      UMA_AS_ISSUER: https://alice-as.uma.lab
      # The resource-server client the AS issues PATs to (client_credentials,
      # scope uma_protection). Alice's day-0 consent for it is seeded.
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      # Two independent credentials for one person: her browser session, and a
      # key her device holds. The portal uses the first; a personal AI holding
      # her key uses the second. Neither is a fallback for the other.
      UMA_AS_OWNER_AUTH: oidc,local-key
      UMA_AS_OWNER_ISSUER: https://keycloak.uma.lab/realms/alice
      UMA_AS_OWNER_KEY: /owner/owner-ed25519.pub
      UMA_AS_OWNER_AUTHORITY: alice-as.uma.lab
      # Her attention, in two lanes. Declared on the server *and* read from the
      # same variable by the check below, so the two cannot drift into a false
      # failure — a checker counting to a number the server does not enforce.
      UMA_AS_PEND_BUDGET: ${UMA_AS_PEND_BUDGET:-5}
      UMA_AS_PEND_BUDGET_ATTRIBUTED: ${UMA_AS_PEND_BUDGET_ATTRIBUTED:-40}
      # Hers, and only hers. Carol's server is the same image with a
      # different name in this variable, and nothing else differs between
      # them — an owner is an owner.
      #
      # Leaving this unset turns the same image into one server holding many
      # owners, which is a packaging choice rather than a different kind of
      # owner. The store is partitioned either way; see lib/test_store.py.
      UMA_AS_OWNER: alice
      # A signature proves a holder, not an owner, so the device key names
      # whose it is.
      UMA_AS_OWNER_KEY_OWNER: alice
      # Trust bundle for verifying issuers' TLS (AAuth dwk discovery and the
      # realm's JWKS both ride https; the lab CA signs *.uma.lab).
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
      # Where an enrolment code is redeemed, if the owner chooses to join an
      # organization. Naming one here is not enrolment and grants nothing:
      # until she enters a code, every line of the organization layer is
      # inert and this server behaves exactly as it did before it existed.
      UMA_AS_ORG_ISSUER: https://northwind-org.uma.lab
      # How the organization reaches this server to deliver a notice. Its
      # view of her authority, which is the address an agent is challenged
      # with here and need not be in general.
      UMA_AS_ORG_CALLBACK: https://alice-as.uma.lab
    volumes:
      - uma-as-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      # Only the public half. Her private key never leaves her side.
      - ./certs/owner-ed25519.pub:/owner/owner-ed25519.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # Carol's authorization server. The same image as Alice's with a different
  # owner in one variable, and that is the whole difference — two owners of
  # the same resource server, each with her own authority, her own keys, her
  # own identity provider and her own record.
  #
  # Compose as many as you like. The only reason these are containers rather
  # than laptops or edge isolates is that the lab has to fit on one machine.
  carol-as:
    init: true
    build:
      context: .
      dockerfile: services/uma-as/Dockerfile
    environment:
      UMA_AS_OWNER: carol
      UMA_AS_ISSUER: https://carol-as.uma.lab
      # No resource server is seeded here, and there is nothing to seed one
      # from: this authority is Carol's, and whoever stood it up was never
      # in a position to configure her brokerage's gateway to match. So the
      # gateway introduces itself instead, and she decides. Alice's server
      # keeps the seeded pair, which is the other true case — an authority
      # provisioned alongside the resource server it protects.
      UMA_AS_SEED_RS: "0"
      UMA_AS_OWNER_AUTH: oidc
      # Hers, not the operator's. An authorization server that accepts the
      # operator's tokens for its owner is only partly the owner's: whoever
      # runs that identity provider can mint her.
      UMA_AS_OWNER_ISSUER: https://keycloak.uma.lab/realms/carol
      UMA_AS_OWNER_AUTHORITY: carol-as.uma.lab
      UMA_AS_PEND_BUDGET: ${UMA_AS_PEND_BUDGET:-5}
      UMA_AS_PEND_BUDGET_ATTRIBUTED: ${UMA_AS_PEND_BUDGET_ATTRIBUTED:-40}
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
      # The same organization Alice's authority can enrol with, and the same
      # two variables. Membership is per owner and self-initiated: Carol
      # joins or does not, independently of Alice, from her own portal, and
      # the charter's patterns reach `carol-vault/...` exactly as they reach
      # `alice-vault/...`. Nothing about this layer is one person's.
      UMA_AS_ORG_ISSUER: https://northwind-org.uma.lab
      UMA_AS_ORG_CALLBACK: https://carol-as.uma.lab
    volumes:
      - carol-as-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  uma-pep:
    init: true
    build:
      context: .
      dockerfile: services/uma-pep/Dockerfile
    environment:
      UMA_AS_PUBLIC: https://alice-as.uma.lab
      UMA_AS_INTERNAL: http://uma-as:9000
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      # Only Alice's authority was provisioned with this gateway. For every
      # other owner there is no secret to hold, so the gateway registers by
      # signing with the key it publishes at its own origin, and waits for
      # her. Adding an owner here means adding a secret to somebody's server;
      # leaving her out of it means she decides for herself.
      UMA_PEP_RS_SECRETS: >-
        {"alice": "${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}"}
      UMA_REALM: alice-vault
      # Meridian holds more than one person's account. Alice is served at
      # /mcp; every owner named here gets /mcp/<owner>, with its own tool
      # namespace, its own PAT, and its own RFC 9728 metadata naming the
      # authority that governs it.
      UMA_EXTRA_OWNERS: carol
      # Which authority governs which owner. Both named, because neither is
      # the default: the resource server holds a PAT from each and enforces
      # for both, and it is the owner who decides which server that is.
      UMA_OWNER_AUTHORITIES: >-
        {"alice": {"public": "https://alice-as.uma.lab",
                   "internal": "http://uma-as:9000"},
         "carol": {"public": "https://carol-as.uma.lab",
                   "internal": "http://carol-as:9000"}}
      # The organization above these owners, configured on the firm's side
      # rather than discovered from an owner's authority — which is the whole
      # value of it. An owner may name any authorization server she likes;
      # the resource still belongs to the organization, so the check that its
      # ceiling was applied has to come from somewhere she does not control.
      # This is also how a break-glass grant, signed by the organization and
      # never seen by her authority, is recognised here.
      UMA_PEP_ORG_ISSUER: https://northwind-org.uma.lab
      UMA_PEP_ORG_INTERNAL: http://org-authority:9040
      UMA_PEP_ORG_TOKEN: ${ORG_RS_TOKEN:-org-rs-dev-token}
      # How long this gateway may act on a cached answer about who is a
      # member. The window is somebody's access to the firm's book after the
      # firm withdrew it, so it is short and it is configuration.
      UMA_PEP_MEMBERSHIP_TTL_S: ${UMA_PEP_MEMBERSHIP_TTL_S:-10}
      # Jointly held accounts. The tally is named here rather than read off a
      # grant: a resource server that accepted whichever issuer embedded a
      # plausible mandate would be taking the electorate from the party that
      # assembled it.
      UMA_PEP_JOINT_TALLY: https://joint-tally.uma.lab
      UMA_PEP_JOINT_TALLY_INTERNAL: http://joint-tally:9060
      UMA_PEP_JOINT_SECRET: ${TALLY_RS_SECRET:-tally-rs-dev-secret}
      UMA_PEP_JOINT_ACCOUNTS: meridian-joint,meridian-either
      # Verifying a holder's verdict means reaching her authority at its
      # public name, which is the only TLS this gateway does to a peer.
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - uma-pep-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      uma-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9002/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.4.0
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./gateway/agw.yaml:/etc/agentgateway/config.yaml:ro
    depends_on:
      uma-pep:
        condition: service_healthy

  alice-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      # gateway (default): an ext_authz service ahead of this server carries
      # the FedAuthz obligations and this process holds no auth code.
      # embedded: the same enforcement core runs here as an MCP Extension, and
      # the gateway is not in the authorization path at all.
      ENFORCEMENT_MODE: ${ENFORCEMENT_MODE:-gateway}
      UMA_AS_PUBLIC: https://alice-as.uma.lab
      UMA_AS_INTERNAL: http://uma-as:9000
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      # Only Alice's authority was provisioned with this gateway. For every
      # other owner there is no secret to hold, so the gateway registers by
      # signing with the key it publishes at its own origin, and waits for
      # her. Adding an owner here means adding a secret to somebody's server;
      # leaving her out of it means she decides for herself.
      UMA_PEP_RS_SECRETS: >-
        {"alice": "${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}"}
      UMA_REALM: alice-vault
      # Meridian holds more than one person's account. Alice is served at
      # /mcp; every owner named here gets /mcp/<owner>, with its own tool
      # namespace, its own PAT, and its own RFC 9728 metadata naming the
      # authority that governs it.
      UMA_EXTRA_OWNERS: carol
      # Which authority governs which owner. Both named, because neither is
      # the default: the resource server holds a PAT from each and enforces
      # for both, and it is the owner who decides which server that is.
      UMA_OWNER_AUTHORITIES: >-
        {"alice": {"public": "https://alice-as.uma.lab",
                   "internal": "http://uma-as:9000"},
         "carol": {"public": "https://carol-as.uma.lab",
                   "internal": "http://carol-as:9000"}}
      UMA_EXPECTED_AUTHORITY: gateway.uma.lab
    volumes:
      # The origin's signing key, shared with the gateway process. It
      # identifies gateway.uma.lab, not a container: both enforcement modes
      # publish it at the same /jwks, and it is what an authority fetches to
      # decide whether this resource server is who it says it is.
      - uma-pep-keys:/keys:ro
    depends_on:
      # Read-only, and after the gateway process: that one creates the key if
      # it is missing, and this one only ever needs to read it. A private key
      # mounted writable into a process that does not write it is an
      # unnecessary way to lose it.
      uma-pep:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('localhost',9020),2)\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # Carol's vault. A separate instance holding her holdings, not a row
  # in Alice's. Same image, different fixtures, different address.
  carol-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      UMA_VAULT_OWNER: carol
      UMA_VAULT_FIXTURES: /app/fixtures-carol.json
      # gateway (default): an ext_authz service ahead of this server carries
      # the FedAuthz obligations and this process holds no auth code.
      # embedded: the same enforcement core runs here as an MCP Extension, and
      # the gateway is not in the authorization path at all.
      ENFORCEMENT_MODE: ${ENFORCEMENT_MODE:-gateway}
      UMA_AS_PUBLIC: https://alice-as.uma.lab
      UMA_AS_INTERNAL: http://uma-as:9000
      UMA_AS_RS_CLIENT_ID: meridian-gateway
      UMA_AS_RS_CLIENT_SECRET: ${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}
      # Only Alice's authority was provisioned with this gateway. For every
      # other owner there is no secret to hold, so the gateway registers by
      # signing with the key it publishes at its own origin, and waits for
      # her. Adding an owner here means adding a secret to somebody's server;
      # leaving her out of it means she decides for herself.
      UMA_PEP_RS_SECRETS: >-
        {"alice": "${UMA_AS_RS_CLIENT_SECRET:-gateway-dev-secret}"}
      UMA_REALM: alice-vault
      # Meridian holds more than one person's account. Alice is served at
      # /mcp; every owner named here gets /mcp/<owner>, with its own tool
      # namespace, its own PAT, and its own RFC 9728 metadata naming the
      # authority that governs it.
      UMA_EXTRA_OWNERS: carol
      # Which authority governs which owner. Both named, because neither is
      # the default: the resource server holds a PAT from each and enforces
      # for both, and it is the owner who decides which server that is.
      UMA_OWNER_AUTHORITIES: >-
        {"alice": {"public": "https://alice-as.uma.lab",
                   "internal": "http://uma-as:9000"},
         "carol": {"public": "https://carol-as.uma.lab",
                   "internal": "http://carol-as:9000"}}
      UMA_EXPECTED_AUTHORITY: gateway.uma.lab
    volumes:
      # The origin's signing key, shared with the gateway process. It
      # identifies gateway.uma.lab, not a container: both enforcement modes
      # publish it at the same /jwks, and it is what an authority fetches to
      # decide whether this resource server is who it says it is.
      - uma-pep-keys:/keys:ro
    depends_on:
      # Read-only, and after the gateway process: that one creates the key if
      # it is missing, and this one only ever needs to read it. A private key
      # mounted writable into a process that does not write it is an
      # unnecessary way to lose it.
      uma-pep:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('localhost',9020),2)\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # Bob's agent operator's public web presence: the CIMD document Alice's AS
  # resolves for her approval dialog, and the Web Bot Auth key directory a
  # resource can consult before any relationship exists.
  # The organization's book. The same vault image again, with the firm's
  # holdings in it rather than a person's — one resource server, and this is
  # the instance that belongs to Northwind rather than to any member.
  #
  # Reached at /mcp/shared/<member>: one resource, administered by whichever
  # member is named, under her own authorization server and her own terms.
  northwind-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      UMA_VAULT_OWNER: northwind
      UMA_VAULT_FIXTURES: /app/fixtures-northwind.json
      ENFORCEMENT_MODE: gateway
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('localhost',9020),2)\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # The account Alice and Carol hold together. The same vault image as every
  # other holding here, with its own book — a jointly held account is not a
  # different kind of resource, it is a resource with a different number of
  # owners.
  joint-vault-mcp:
    init: true
    build:
      context: .
      dockerfile: mcp/alice-vault/Dockerfile
    environment:
      UMA_VAULT_OWNER: joint
      UMA_VAULT_FIXTURES: /app/fixtures-joint.json
      ENFORCEMENT_MODE: gateway
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('localhost',9020),2)\""]
      interval: 3s
      timeout: 5s
      retries: 10

  agent-operator:
    init: true
    build: ./clients/agent-operator
    environment:
      AGENT_OPERATOR_ORIGIN: https://agent.uma.lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9030/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # Alice's own web presence, and the reason there are two of these: an
  # operator directory is a party's *own* infrastructure. Bob's firm publishes
  # its agents' keys at agent.uma.lab; Alice publishes hers here. Nothing in
  # the service differs — it holds no authoritative state and is parameterised
  # by origin — which is what makes running several correct rather than a
  # duplication. See clients/agent-operator/server.py.
  alice-operator:
    init: true
    build: ./clients/agent-operator
    environment:
      AGENT_OPERATOR_ORIGIN: https://alice-agent.uma.lab
      AGENT_OPERATOR_NAME: Alice's own agent
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9030/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  alice-portal:
    init: true
    build: ./services/alice-portal
    environment:
      UMA_AS_INTERNAL: http://uma-as:9000
      UMA_PORTAL_OWNER: alice
      PORTAL_AUTH: ${PORTAL_AUTH:-oidc}
      OIDC_ISSUER: https://keycloak.uma.lab/realms/alice
      OIDC_CLIENT_ID: meridian-portal
      PORTAL_PUBLIC_URL: https://portal.uma.lab
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-session-secret}
      VAULT_MCP_URL: http://alice-vault-mcp:9020/mcp
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9010/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # Carol's portal. The same image as Alice's with four variables changed,
  # and that is the whole of it: an owner is her authority, her identity
  # provider, her record and the surface she answers from, and every one of
  # those is configuration here rather than another implementation.
  carol-portal:
    init: true
    build: ./services/alice-portal
    environment:
      UMA_AS_INTERNAL: http://carol-as:9000
      UMA_PORTAL_OWNER: carol
      PORTAL_AUTH: ${PORTAL_AUTH:-oidc}
      OIDC_ISSUER: https://keycloak.uma.lab/realms/carol
      OIDC_CLIENT_ID: meridian-portal
      PORTAL_PUBLIC_URL: https://carol-portal.uma.lab
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-session-secret}
      VAULT_MCP_URL: http://carol-vault-mcp:9020/mcp
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9010/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # The organization's policy engine.
  #
  # A real one, and the choice is the argument rather than a shortcut. The
  # site's own comparison page says an engine slots in as the evaluation core
  # of an authorization server and that the two compose; this is that claim
  # standing up. Note *which* layer it evaluates: the organization's, where
  # the operator genuinely is the deciding party and a compliance team wants
  # a real policy language. The member's layer stays a small legible document
  # she can read without one.
  opa:
    init: true
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error"]
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Northwind Capital's authority — the layer above a member.
  #
  # Its own party, deliberately, rather than a table inside anyone's
  # authorization server. Alice's authority holds a ceiling and asks this for
  # decisions; this holds the charter and never sees her policy. Neither can
  # read the other's, which is the arrangement the whole thing is about.
  # One resource, several owners of equal standing, and an authority that is
  # nobody's. This service counts the holders' signed verdicts and holds no
  # policy of its own — see the module docstring for why that is the whole
  # design rather than a simplification.
  joint-tally:
    init: true
    build:
      context: .
      dockerfile: services/joint-tally/Dockerfile
    environment:
      TALLY_ISSUER: https://joint-tally.uma.lab
      TALLY_AUDIENCE: https://gateway.uma.lab
      TALLY_RS_SECRET: ${TALLY_RS_SECRET:-tally-rs-dev-secret}
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
      # A minimum the holders may not vote themselves below. Zero here so the
      # lab can carry both an every-holder account and an either-holder one;
      # set it and the second is refused at startup, by name. The floor is
      # what an account agreement or a regulator supplies in the world, and
      # it is the only answer to what quorum sets the quorum.
      TALLY_THRESHOLD_FLOOR: ${TALLY_THRESHOLD_FLOOR:-0}
      TALLY_SIGNING_KEY: /keys/tally-ed25519.pem
      TALLY_MANDATES: '{"meridian-joint":{"resources":["meridian-joint/get_positions","meridian-joint/get_transactions","meridian-joint/execute_trade"],"holders":[{"owner":"alice","issuer":"https://alice-as.uma.lab"},{"owner":"carol","issuer":"https://carol-as.uma.lab"}],"rule":{"kind":"all"}},"meridian-either":{"resources":["meridian-either/get_positions","meridian-either/get_transactions","meridian-either/execute_trade"],"holders":[{"owner":"alice","issuer":"https://alice-as.uma.lab"},{"owner":"carol","issuer":"https://carol-as.uma.lab"}],"rule":{"kind":"any"}}}'
    volumes:
      - tally-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      uma-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9060/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  org-authority:
    init: true
    build:
      context: .
      dockerfile: services/org-authority/Dockerfile
    environment:
      ORG_ISSUER: https://northwind-org.uma.lab
      ORG_ID: northwind
      ORG_NAME: Northwind Capital
      OPA_URL: http://opa:8181
      ORG_ADMIN_ISSUER: https://keycloak.uma.lab/realms/northwind
      ORG_ADMIN_CLIENTS: meridian-org-console
      # The static credential is for the acceptance container, which has no
      # browser to log in with. An administrator uses the realm above.
      ORG_ADMIN_TOKEN: ${ORG_ADMIN_TOKEN:-org-admin-dev-token}
      ORG_RS_TOKEN: ${ORG_RS_TOKEN:-org-rs-dev-token}
      ORG_JOIN_CODE: ${ORG_JOIN_CODE:-NW-7K2F-QX}
      UMA4A_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - org-keys:/keys
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9040/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  # The administrator's surface, hosted by Meridian for its institutional
  # clients. The same chassis as the client portal and the same rule: it
  # holds no policy, decides nothing, and exists so the administrator's token
  # never reaches a browser.
  org-console:
    init: true
    build: ./services/org-console
    environment:
      ORG_AUTHORITY_INTERNAL: http://org-authority:9040
      CONSOLE_AUTH: ${PORTAL_AUTH:-oidc}
      OIDC_ISSUER: https://keycloak.uma.lab/realms/northwind
      OIDC_CLIENT_ID: meridian-org-console
      CONSOLE_PUBLIC_URL: https://org-console.uma.lab
      CONSOLE_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-session-secret}
      ORG_ADMIN_TOKEN: ${ORG_ADMIN_TOKEN:-org-admin-dev-token}
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      keycloak:
        condition: service_healthy
      org-authority:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9050/health')\""]
      interval: 3s
      timeout: 5s
      retries: 10

  person-server:
    init: true
    build:
      context: ./aauth
      dockerfile: person-server.Dockerfile
    environment:
      AAUTH_DATABASE_URL: sqlite:////data/aauth.db
      AAUTH_PS_SIGNING_KEY_PATH: /data/.aauth/ps-signing-key.pem
      AAUTH_AS_SIGNING_KEY_PATH: /data/.aauth/as-signing-key.pem
      AAUTH_PS_PUBLIC_ORIGIN: https://ps.uma.lab
      AAUTH_AS_PUBLIC_ORIGIN: https://ps.uma.lab
      AAUTH_AS_SERVER_DOMAIN: ps.uma.lab
      AAUTH_PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
      AAUTH_AS_PERSON_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
      AAUTH_PS_INSECURE_DEV: "true"
      AAUTH_AS_INSECURE_DEV: "true"
    volumes:
      - ps-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/.well-known/aauth-person.json"]
      interval: 5s
      timeout: 5s
      retries: 15

  loki:
    init: true
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    init: true
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./observability/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    init: true
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SERVER_ROOT_URL: https://grafana.uma.lab
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  # Headless walker for the demo acts (same grant code path as the agent-shim).
  demo-driver:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' 'aauth==0.3.2' && exec python /driver/driver.py --cacert /driver/rootCA.pem "$$@"
      - --
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
      UMA4A_ALICE_OPERATOR: https://alice-agent.uma.lab
    volumes:
      - ./clients/demo-driver/driver.py:/driver/driver.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      # Bob's agent's long-term (stable) key survives runs, so the agent
      # server recognizes the agent and Alice's connection stays standing.
      - driver-keys:/driver/keys
    working_dir: /driver
    profiles: ["demo"]

  # Four agents, four identity regimes, one unchanged owner. Verifies that
  # nothing about who the agent is reaches Alice's authorization decision.
  intent-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/intent_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      UMA_AS_MAX_REASON: ${UMA_AS_MAX_REASON:-512}
    volumes:
      - ./clients/demo-driver/intent_check.py:/driver/intent_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  first-party-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/first_party_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      UMA4A_ALICE_OPERATOR: https://alice-agent.uma.lab
      UMA4A_AGENT_OPERATOR: https://agent.uma.lab
    volumes:
      - ./clients/demo-driver/first_party_check.py:/driver/first_party_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  establishment-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' cryptography && exec python /driver/establishment_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./clients/demo-driver/establishment_check.py:/driver/establishment_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  multi-owner-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/multi_owner_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      UMA4A_ALICE_OPERATOR: https://alice-agent.uma.lab
      UMA4A_AGENT_OPERATOR: https://agent.uma.lab
    volumes:
      - ./clients/demo-driver/multi_owner_check.py:/driver/multi_owner_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  # The organization layer, end to end across five processes: two members'
  # authorities, the organization's, its engine, and the enforcement point.
  org-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/org_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      ORG_ADMIN_TOKEN: ${ORG_ADMIN_TOKEN:-org-admin-dev-token}
      ORG_JOIN_CODE: ${ORG_JOIN_CODE:-NW-7K2F-QX}
      UMA4A_AGENT_OPERATOR: https://agent.uma.lab
      UMA4A_ALICE_OPERATOR: https://alice-agent.uma.lab
      UMA_PEP_MEMBERSHIP_TTL_S: ${UMA_PEP_MEMBERSHIP_TTL_S:-10}
      UMA_AS_RESOURCE_REFRESH_S: ${UMA_AS_RESOURCE_REFRESH_S:-15}
    volumes:
      - ./clients/demo-driver/org_check.py:/driver/org_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  joint-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/joint_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      UMA4A_TALLY: https://joint-tally.uma.lab
    volumes:
      - ./clients/demo-driver/joint_check.py:/driver/joint_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  assurance-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/assurance_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      UMA_AS_PEND_BUDGET: ${UMA_AS_PEND_BUDGET:-5}
    volumes:
      - ./clients/demo-driver/assurance_check.py:/driver/assurance_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    profiles: ["test"]

  # The U4A adapter as a service: the same shim Bob runs beside Claude Code,
  # reachable over the network so an agent that is not a local process can use
  # it. Off by default; `make adapter` starts it.
  agent-shim:
    init: true
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q 'mcp>=2,<3' httpx 'pyjwt[crypto]' && exec python /shim/shim.py
    environment:
      UMA4A_SHIM_TRANSPORT: streamable-http
      UMA4A_SHIM_HOST: 0.0.0.0
      UMA4A_SHIM_PORT: "9030"
      UMA4A_GATEWAY: https://gateway.uma.lab/mcp
      UMA4A_CACERT: /certs/rootCA.pem
      UMA4A_KEYSTORE: /keys/agent-key.pem
      # No interactive client above it, so Alice's terms are decided by Bob's
      # standing configuration — bounded, and set by a person in advance.
      UMA4A_STANDING_MAX_EXPIRES: "604800"
      PYTHONPATH: /shim/lib
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./clients/agent-shim/shim.py:/shim/shim.py:ro
      - ./lib:/shim/lib:ro
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - driver-keys:/keys
    profiles: ["adapter"]

  adapter-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q 'mcp>=2,<3' httpx && exec python /driver/adapter_check.py
    environment:
      UMA4A_SHIM_URL: http://agent-shim:9030/mcp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./clients/demo-driver/adapter_check.py:/driver/adapter_check.py:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
    profiles: ["adapter"]

  flow-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' 'aauth==0.3.2' && exec python /driver/flow_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-uma4agents-ps-admin}
    volumes:
      - ./clients/demo-driver/flow_check.py:/driver/flow_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    working_dir: /driver
    profiles: ["test"]

  # Kwaai's pAI-OS, with the U4A ability installed under abilities/.
  #
  # A personal AI running beside the rest of the lab, holding Alice's key and
  # answering her authorization server when somebody else's agent asks for
  # something of hers. Built from a pinned upstream ref by `make
  # fetch-upstream`, with one directory added — which is how pAI-OS takes an
  # extension.
  paios:
    init: true
    build:
      context: .
      dockerfile: kwaai/Dockerfile
    environment:
      PAIOS_HOST: 0.0.0.0
      U4A_AUTHORITY_URL: https://alice-as.uma.lab
      U4A_AUTHORITY_NAME: alice-as.uma.lab
      U4A_OWNER_KEY: /owner/owner-ed25519.pem
      U4A_CA_BUNDLE: /certs/rootCA.pem
      # Her standing consent, set by her. Without it the ability denies
      # everything, because pAI-OS gives it no way to ask her.
      U4A_AUTO_TIERS: ${PAIOS_AUTO_TIERS:-tier1}
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      # Her private key. Only this container and she have it; her
      # authorization server holds the public half.
      - ./certs/owner-ed25519.pem:/owner/owner-ed25519.pem:ro
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - paios-data:/opt/paios/data
    depends_on:
      uma-as:
        condition: service_healthy
    profiles: ["kwaai"]

  # The personal-AI binding against the full stack: her authority, her portal,
  # the gateway and the vault all as they really are — and a personal AI
  # holding her key instead of a browser session.
  kwaai-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' cryptography && exec python /kwaai/check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./kwaai:/kwaai:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - ./certs/owner-ed25519.pem:/owner/owner-ed25519.pem:ro
      - driver-keys:/driver/keys
    working_dir: /driver
    profiles: ["test"]

  # Verifies the four-beat grant against a resource that protects itself:
  # ENFORCEMENT_MODE=embedded, no gateway and no ext_authz in the path.
  embedded-check:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q httpx 'pyjwt[crypto]' && exec python /driver/embedded_check.py
    environment:
      PYTHONPATH: /driver/lib
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./clients/demo-driver/embedded_check.py:/driver/embedded_check.py:ro
      - ./lib:/driver/lib:ro
      - ./certs/rootCA.pem:/driver/rootCA.pem:ro
      - driver-keys:/driver/keys
    working_dir: /driver
    profiles: ["test"]

  # Headless verification of the agent-shim under a scripted MCP client.
  shim-test:
    image: python:3.12-slim
    entrypoint:
      - /bin/bash
      - -c
      - pip install -q 'mcp>=2,<3' httpx 'pyjwt[crypto]' && exec python /repo/clients/agent-shim/test_shim.py
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/repo:ro
    profiles: ["test"]

volumes:
  carol-as-keys:
  org-keys:
  tally-keys:
  paios-data:
  uma-as-keys:
  uma-pep-keys:
  ps-data:
  driver-keys:
