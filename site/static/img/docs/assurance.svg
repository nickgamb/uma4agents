<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- agent assurance: one answer, two opposing forces, and only one of them
       allowed to open a door.
       Colour: site/src/style/theme.js · brand direction 1b -->
  <defs>
    <marker id="hR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#cf6a6a"/>
    </marker>
    <marker id="hL" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#bcdb2c"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#0a0b0d"/>

  <g transform="translate(40 24) scale(0.53125)">
    <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="15" fill="#0a0b0d" stroke="#8cc2d4" stroke-width="2.8"/>
    <g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 17 L11 33 A5.75 5.75 0 0 0 22.5 33 L22.5 17" stroke="#ffffff"/>
      <path d="M34.5 17 L26.25 31 L37.75 31 M34.5 17 L34.5 39" stroke="#bcdb2c"/>
      <path d="M41.5 39 L47.25 17 L53 39 M43.5 31.5 L51 31.5" stroke="#ffffff"/>
    </g>
  </g>
  <text x="92" y="44" fill="#ffffff" font-size="21" font-weight="600">Agent assurance</text>
  <text x="92" y="66" fill="#757b83" font-size="14.5">Showing more never buys access. It only avoids the friction that showing less would have cost.</text>

  <text x="40" y="122" fill="#ffffff" font-size="12.5" letter-spacing="1.6" font-weight="600">WHAT THIS REQUEST NEEDS BEFORE IT IS GRANTED</text>

  <line x1="150" y1="186" x2="1050" y2="186" stroke="#2a2f36" stroke-width="3"/>

  <circle cx="250" cy="186" r="13" fill="#0a0b0d" stroke="#bcdb2c" stroke-width="3"/>
  <text x="250" y="163" fill="#bcdb2c" font-size="16" font-weight="600" text-anchor="middle">grant quietly</text>
  <text x="250" y="220" fill="#757b83" font-size="12.5" text-anchor="middle">her policy already answered</text>

  <circle cx="600" cy="186" r="13" fill="#0a0b0d" stroke="#e2b23c" stroke-width="3"/>
  <text x="600" y="163" fill="#e2b23c" font-size="16" font-weight="600" text-anchor="middle">ask her</text>
  <text x="600" y="220" fill="#757b83" font-size="12.5" text-anchor="middle">the request waits, holding its ticket</text>
  <text x="600" y="240" fill="#5d646c" font-size="11.5" text-anchor="middle">wherever her tier starts</text>

  <circle cx="950" cy="186" r="13" fill="#0a0b0d" stroke="#cf6a6a" stroke-width="3"/>
  <text x="950" y="163" fill="#cf6a6a" font-size="16" font-weight="600" text-anchor="middle">refuse</text>
  <text x="950" y="220" fill="#757b83" font-size="12.5" text-anchor="middle">it never reaches her at all</text>

  <path d="M586 186 H278" stroke="#bcdb2c" stroke-width="2.4" fill="none" marker-end="url(#hL)"/>
  <path d="M614 186 H922" stroke="#cf6a6a" stroke-width="2.4" fill="none" marker-end="url(#hR)"/>

  <text x="418" y="270" fill="#bcdb2c" font-size="13.5" text-anchor="middle" font-weight="600">&#9664; easier</text>
  <text x="782" y="270" fill="#cf6a6a" font-size="13.5" text-anchor="middle" font-weight="600">stricter &#9654;</text>

  <rect x="40" y="298" width="500" height="150" rx="10" fill="#0f1114" stroke="#bcdb2c" stroke-width="1.8"/>
  <text x="64" y="330" fill="#bcdb2c" font-size="12.5" letter-spacing="1.5" font-weight="600">ONE THING MAY MOVE IT LEFT</text>
  <text x="64" y="358" fill="#ffffff" font-size="16" font-weight="600">Decisions Alice made herself</text>
  <text x="64" y="382" fill="#9aa2ab" font-size="12.5">she admitted this agent &#183; she approved at this tier &#183; never revoked</text>
  <text x="64" y="410" fill="#9aa2ab" font-size="12.5">The one kind of evidence the requesting side had no hand in</text>
  <text x="64" y="428" fill="#9aa2ab" font-size="12.5">producing &#8212; and the only kind allowed to lower a requirement.</text>

  <rect x="580" y="298" width="580" height="150" rx="10" fill="#0f1114" stroke="#cf6a6a" stroke-width="1.8"/>
  <text x="604" y="330" fill="#cf6a6a" font-size="12.5" letter-spacing="1.5" font-weight="600">EVERYTHING ELSE MAY ONLY MOVE IT RIGHT</text>
  <text x="604" y="358" fill="#ffffff" font-size="16" font-weight="600">What the agent could not show</text>
  <text x="604" y="380" fill="#9aa2ab" font-size="12.5">no operator named &#183; a key with nothing to check it against</text>
  <text x="604" y="408" fill="#ffffff" font-size="16" font-weight="600">What this server recorded</text>
  <text x="604" y="430" fill="#9aa2ab" font-size="12.5">never granted here before &#183; revoked once already</text>

  <text x="40" y="502" fill="#8cc2d4" font-size="12.5" letter-spacing="1.6" font-weight="600">THE THREE THINGS SHE CAN CHECK &#183; NEVER ADDED UP</text>
  <text x="40" y="523" fill="#757b83" font-size="13">Each one on its own. A strong showing on one never makes up for a gap on another, so there is no score.</text>

  <g fill="#0f1114" stroke="#8cc2d4" stroke-width="1.6">
    <rect x="40" y="540" width="352" height="128" rx="10"/>
    <rect x="416" y="540" width="352" height="128" rx="10"/>
    <rect x="792" y="540" width="368" height="128" rx="10"/>
  </g>

  <text x="62" y="566" fill="#ffffff" font-size="15" font-weight="600">binding</text>
  <text x="62" y="588" fill="#9aa2ab" font-size="12.5">Will she recognise this key next time?</text>
  <text x="62" y="614" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 &#160;signed request, key she can name</text>
  <text x="62" y="654" fill="#5d646c" font-size="11.5">never 0 here &#8212; the grant will not proceed without it</text>

  <text x="438" y="566" fill="#ffffff" font-size="15" font-weight="600">provenance</text>
  <text x="438" y="588" fill="#9aa2ab" font-size="12.5">Can she check where the credential came from?</text>
  <text x="438" y="614" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 &#160;self-minted &#160;&#160; 1 &#160;issuer verified</text>
  <text x="438" y="654" fill="#5d646c" font-size="11.5">at 0 her policy may ask her; at 1 it simply does not</text>

  <text x="814" y="566" fill="#ffffff" font-size="15" font-weight="600">accountability</text>
  <text x="814" y="588" fill="#9aa2ab" font-size="12.5">Is anyone named and reachable behind it?</text>
  <text x="814" y="612" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 &#160;none &#160;&#160;&#160; 1 &#160;the operator says so</text>
  <text x="814" y="632" fill="#8cc2d4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2 &#160;the operator published this key</text>
  <text x="814" y="654" fill="#5d646c" font-size="11.5">2 is checkable &#8212; she fetches that directory herself</text>

  <line x1="40" y1="696" x2="1160" y2="696" stroke="#2a2f36" stroke-width="1"/>
  <text x="40" y="728" fill="#bcdb2c" font-size="17" font-weight="600">A lie can only cost the liar friction.</text>
  <text x="404" y="728" fill="#757b83" font-size="13.5">Which is why her policy can safely read what an agent says about itself &#8212; and why none of this needs a registry.</text>
</svg>
