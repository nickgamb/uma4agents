# Edge proxy: one TLS front door for every *.uma.lab hostname (SNI/Host routed).
# Certificates come from make init (mkcert local CA).
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: edge_https
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: edge_routes
                  virtual_hosts:
                    - name: alice-as
                      domains: ["alice-as.uma.lab", "alice-as.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: uma_as }
                    - name: carol-as
                      domains: ["carol-as.uma.lab", "carol-as.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: carol_as }
                    - name: keycloak
                      domains: ["keycloak.uma.lab", "keycloak.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: keycloak }
                    - name: gateway
                      domains: ["gateway.uma.lab", "gateway.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: agentgateway }
                    - name: portal
                      domains: ["portal.uma.lab", "portal.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: alice_portal }
                    - name: carol_portal
                      domains: ["carol-portal.uma.lab", "carol-portal.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: carol_portal }
                    - name: org_authority
                      domains: ["northwind-org.uma.lab", "northwind-org.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: org_authority }
                    - name: northwind_idp
                      domains: ["northwind-idp.uma.lab", "northwind-idp.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: northwind_idp }
                    - name: xaa_broker
                      domains: ["northwind-xaa.uma.lab", "northwind-xaa.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: xaa_broker }
                    - name: joint_tally
                      domains: ["joint-tally.uma.lab", "joint-tally.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: joint_tally }
                    - name: org_console
                      domains: ["org-console.uma.lab", "org-console.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: org_console }
                    - name: grafana
                      domains: ["grafana.uma.lab", "grafana.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: grafana }
                    - name: ps
                      domains: ["ps.uma.lab", "ps.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: person_server }
                    - name: agent_operator
                      domains: ["agent.uma.lab", "agent.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: agent_operator }
                    - name: alice_operator
                      domains: ["alice-agent.uma.lab", "alice-agent.uma.lab:*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: alice_operator }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: "/certs/edge-server.pem" }
                    private_key: { filename: "/certs/edge-server-key.pem" }

  clusters:
    - name: uma_as
      type: STRICT_DNS
      load_assignment:
        cluster_name: uma_as
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: uma-as, port_value: 9000 } }
    - name: carol_as
      type: STRICT_DNS
      load_assignment:
        cluster_name: carol_as
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: carol-as, port_value: 9000 } }
    - name: keycloak
      type: STRICT_DNS
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: keycloak, port_value: 8080 } }
    - name: agentgateway
      type: STRICT_DNS
      load_assignment:
        cluster_name: agentgateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: agentgateway, port_value: 3000 } }
    - name: alice_portal
      type: STRICT_DNS
      load_assignment:
        cluster_name: alice_portal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: alice-portal, port_value: 9010 } }
    - name: carol_portal
      type: STRICT_DNS
      load_assignment:
        cluster_name: carol_portal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: carol-portal, port_value: 9010 } }
    - name: org_authority
      type: STRICT_DNS
      load_assignment:
        cluster_name: org_authority
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: org-authority, port_value: 9040 } }
    - name: northwind_idp
      type: STRICT_DNS
      load_assignment:
        cluster_name: northwind_idp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: northwind-idp, port_value: 8081 } }
    - name: xaa_broker
      type: STRICT_DNS
      load_assignment:
        cluster_name: xaa_broker
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: xaa-broker, port_value: 9080 } }
    - name: joint_tally
      type: STRICT_DNS
      load_assignment:
        cluster_name: joint_tally
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: joint-tally, port_value: 9060 } }
    - name: org_console
      type: STRICT_DNS
      load_assignment:
        cluster_name: org_console
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: org-console, port_value: 9050 } }
    - name: grafana
      type: STRICT_DNS
      load_assignment:
        cluster_name: grafana
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: grafana, port_value: 3000 } }
    - name: person_server
      type: STRICT_DNS
      load_assignment:
        cluster_name: person_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: person-server, port_value: 8765 } }
    - name: agent_operator
      type: STRICT_DNS
      load_assignment:
        cluster_name: agent_operator
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: agent-operator, port_value: 9030 } }

    - name: alice_operator
      type: STRICT_DNS
      load_assignment:
        cluster_name: alice_operator
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: alice-operator, port_value: 9030 } }
